<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dirty Deal">
<meta name="theme-color" content="#070605">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Dirty Deal</title>
<style>@font-face{font-family:'Silkscreen';font-weight:400;font-display:swap;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-weight:700;font-display:swap;src:url(fonts/silkscreen-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'VT323';font-weight:400;font-display:swap;src:url(fonts/vt323-latin-400-normal.woff2) format('woff2')}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior:none;position:fixed;inset:0;-webkit-touch-callout:none}
</style>
<style>
/* Layout: a fixed 9:16 game stage scaled to the screen; every element is placed in % over the painted arena. Single dark look by design. */
:root{
  --ink:#070605; --paper:#e6d6b0; --muted:#9a8a6c; --bulb:#f0c95c; --blood:#d23a2a; --atk:#ff7a5c; --hp:#9cc9ff; --psn:#a6d257; --gum:#f59ad3;
  --display:'Silkscreen','Courier New',monospace; --body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
img{image-rendering:pixelated;-webkit-user-drag:none;pointer-events:none}
.wrap{height:100%;display:grid;place-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:relative;height:100%;max-height:calc((100vw - 32px)*1376/768);aspect-ratio:768/1376;max-width:100%;container-type:size;overflow:hidden;
  background:#0d0b09;image-rendering:pixelated;--tilt:38deg;--r1w:18%;--r1t:35%;--r1a:20.8%;--r1b:41%;--r1c:61.2%;--r0w:21.5%;--r0t:47.5%;--r0a:13.9%;--r0b:39.25%;--r0c:64.6%}
#bg{position:absolute;left:0;width:100%;top:0;height:100%;background:url(assets/table.jpg) center/100% 100% no-repeat}
#bg::after{content:"";position:absolute;left:0;right:0;top:100%;height:12%;background:linear-gradient(#0d0b09,#0d0b09)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%)}
.abs{position:absolute}
button{font-family:var(--display);cursor:pointer;background:none;border:0;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}

/* top */
.bar{position:absolute;height:2.5cqh;background:url(assets/u_bar_e.png) center/100% 100% no-repeat}
.bar i{position:absolute;left:5.5%;top:26%;bottom:26%;background:var(--blood);transition:width .3s steps(5);
  background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px)}
.bar.me i{background-color:#6ea83c}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.6cqw;color:#fff;text-shadow:1px 1px 0 #000}
#ehp{right:4%;top:2%;width:40%}
#eicon{right:45%;top:1.4%;width:6.5%}
#round{left:4%;top:1.4%;font-family:var(--display);font-weight:700;font-size:4cqw;color:var(--bulb);text-shadow:2px 2px 0 #000;text-align:left;line-height:1.1}
#round small{display:block;font-size:2.4cqw;color:var(--muted);font-weight:400}
#dealerWrap{left:50%;top:12.6%;height:23.8%;translate:-50% 0;z-index:1}
#dealer{display:block;height:100%;transition:transform .2s steps(3)}
#dealer.bump{transform:translateY(-3%)}
#info{opacity:0;pointer-events:none;transition:opacity .25s;left:4%;top:5.6%;width:92%;height:8.6%;background:rgba(8,6,5,.78);border:2px solid #000;box-shadow:0 0 0 1px rgba(230,214,176,.25);
  padding:1.2cqw 2cqw;font-size:3.4cqw;line-height:1;overflow:hidden;z-index:2}
#logline{display:none;font-family:var(--display);font-size:2.5cqw;letter-spacing:.06em;color:var(--bulb);font-weight:700;margin-bottom:.8cqw;text-shadow:0 0 6px rgba(240,201,92,.45)}
#info strong{color:var(--paper);font-weight:400;font-family:var(--display);font-size:2.4cqw;letter-spacing:.04em;display:block}
#info em{font-style:normal;color:var(--muted)}

.snd{position:absolute;z-index:7;width:8.4cqw;height:8.4cqw;display:grid;place-items:center;background:rgba(8,6,5,.7);border:2px solid #000;box-shadow:0 0 0 1px rgba(240,201,92,.35)}
.snd svg{width:70%;height:70%}
.snd .x{display:none}.snd.off .x{display:inline}.snd.off .w{display:none}
#pauseB{left:38.6%;top:1.1%;width:7cqw;height:7cqw}
#pauseB .x{display:none!important}
#pauseScr{z-index:55;background:rgba(5,4,3,.82);display:grid;place-items:center;padding:0 8%}
#pauseScr .box{animation:popin .25s cubic-bezier(.2,1.4,.4,1)}
#pauseScr .pbtns{display:flex;flex-direction:column;gap:3cqw;align-items:stretch;margin-top:3cqw}
#pauseScr .b{justify-content:center;font-size:4cqw;padding:3cqw}
/* atmosphere */
#glow{left:22.1%;top:13.8%;width:120cqw;height:120cqw;translate:-50% -50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,226,140,.55) 0 2.5%,rgba(255,200,100,.22) 9%,rgba(255,180,80,.08) 30%,transparent 60%);animation:bulb 5.3s infinite steps(1)}
#flick{inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 22% 14%,rgba(0,0,0,.2),rgba(0,0,0,.55));opacity:0;animation:dim 5.3s infinite steps(1)}
@keyframes bulb{0%{opacity:1}31%{opacity:.75}32%{opacity:1}52%{opacity:.25}53%{opacity:.9}54%{opacity:.15}56%{opacity:1}78%{opacity:.6}79%{opacity:1}93%{opacity:.85}94%{opacity:1}}
@keyframes dim{0%{opacity:0}31%{opacity:.25}32%{opacity:0}52%{opacity:.75}53%{opacity:.1}54%{opacity:.9}56%{opacity:0}78%{opacity:.4}79%{opacity:0}93%{opacity:.15}94%{opacity:0}}
.smoke{position:absolute;width:0;height:0;pointer-events:none;z-index:1}
.smoke span{position:absolute;left:0;top:0;width:4.4cqw;height:4.4cqw;margin:-2.2cqw;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(215,208,190,.62),rgba(215,208,190,.2) 45%,transparent 70%);animation:puff var(--d) linear var(--dl) infinite}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.35)}12%{opacity:.85}55%{transform:translate(calc(var(--x) * .5),-6cqh) scale(1.6)}100%{opacity:0;transform:translate(var(--x),-13cqh) scale(3)}}

/* arena */
.slot{position:absolute;aspect-ratio:312/530;display:grid;place-items:center;cursor:pointer;transform:perspective(90cqw) rotateX(var(--tilt));transform-origin:50% 100%;transform-style:preserve-3d}
.slot::after{content:"";position:absolute;inset:2%;border:2px dashed rgba(230,214,176,.28);pointer-events:none}
.slot:has(.cd)::after{display:none}
.slot.open::before{content:"";position:absolute;inset:3%;border:2px solid rgba(240,201,92,.75);box-shadow:0 0 10px rgba(240,201,92,.5),inset 0 0 10px rgba(240,201,92,.35);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.45}}
.r1{width:var(--r1w);top:var(--r1t)}.r0{width:var(--r0w);top:var(--r0t)}
.r1.c0{left:var(--r1a)}.r1.c1{left:var(--r1b)}.r1.c2{left:var(--r1c)}
.r0.c0{left:var(--r0a)}.r0.c1{left:var(--r0b)}.r0.c2{left:var(--r0c)}
.stage:not(.a1) .smoke{display:none}
#rain,#bolt{position:absolute;inset:0;pointer-events:none;display:none}
.a3 #rain{display:block;z-index:3;opacity:.5;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(190,210,235,.35) 9px 10px,transparent 10px 23px);background-size:100% 46px;animation:rain .35s linear infinite}
@keyframes rain{to{background-position:-12px 46px}}
.a3 #bolt{display:block;z-index:4;background:rgba(220,230,255,.9);mix-blend-mode:screen;opacity:0;animation:bolt 9s infinite steps(1)}
@keyframes bolt{0%{opacity:0}61%{opacity:.55}62%{opacity:0}63%{opacity:.35}64%{opacity:0}}
#bolt.now{animation:boltnow .5s steps(1)}
@keyframes boltnow{0%{opacity:.9}20%{opacity:0}40%{opacity:.7}60%{opacity:0}}
.a2 #flick,.a4 #flick{animation-duration:4.1s}
.slot .cd{filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
#log{display:none;left:50%;top:75.2%;transform:translate(-50%,-50%);font-family:var(--display);font-size:3.2cqw;color:var(--bulb);background:rgba(8,6,5,.82);padding:.6cqw 2.4cqw;white-space:nowrap;text-shadow:0 0 6px rgba(240,201,92,.5);z-index:5;border:1px solid #000}

/* card */
.cd{position:relative;height:100%;aspect-ratio:312/530;container-type:inline-size}
.hcard .cd,.dc .cd{height:auto;width:100%}
.cd>img{position:absolute}
.cd .fr{inset:0;width:100%;height:100%}
.cd .art{left:2%;top:3%;width:96%;height:60%;object-fit:contain;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.6))}
.cd .back{inset:0;width:100%;height:100%}
.cd span{position:absolute;display:grid;place-items:center;text-align:center;line-height:1}
.cost{z-index:2;left:3.5%;top:2.4%;width:19%;aspect-ratio:1;font-family:var(--display);font-weight:700;font-size:15cqw;color:var(--bulb);text-shadow:2px 2px 0 #000}
.nm{left:5%;right:5%;top:62%;height:19%;font-size:18cqw;color:#f3e6c4;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.cd.spell .nm{color:#e9dcff;top:60%}
.cd.token .nm{color:#fff}
.st{top:83.5%;width:18%;height:12.6%;font-family:var(--display);font-weight:700;font-size:15cqw;text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.atk{left:6%;color:var(--atk)}.hpv{right:6%;color:var(--hp)}
.cd .chips{position:absolute;right:4%;top:10%;display:flex;flex-direction:column;gap:2cqw;align-items:flex-end;z-index:2}
.chip{display:flex;align-items:center;font-family:var(--display);font-size:11cqw;color:#fff;text-shadow:1px 1px 0 #000}
.chip img{position:static;width:22cqw;height:auto}

/* bottom */
#php{left:3%;top:70%;width:40%}
#coins{left:45%;top:69.3%;display:flex;align-items:center;gap:1.5cqw;font-family:var(--display);font-weight:700;font-size:5cqw;color:var(--bulb);text-shadow:2px 2px 0 #000}
#coins img{width:6.5cqw}
#hand{left:3%;top:76.8%;width:94%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.1%;z-index:3}
.hcard{transition:transform .12s;cursor:pointer}
.hcard.sel{transform:translateY(-8%) scale(1.04)}
.hcard.sel .cd{filter:drop-shadow(0 0 4px var(--bulb)) drop-shadow(0 0 2px var(--bulb))}
.hcard.poor .cd{filter:grayscale(.85) brightness(.5)}
.hcard.used{visibility:hidden}
#fight{right:3%;top:68.2%;width:30%;z-index:4}
#fight img{width:100%}
#fight:not(:disabled):active{transform:translateY(3%)}
#fight:disabled{cursor:default}

/* flying cards + croupier hand */
.fly{position:absolute;left:0;top:0;z-index:20;perspective:700px;pointer-events:none;transform-origin:50% 50%;will-change:transform}
.fly .cd{height:auto;width:100%}
.f3{position:relative;transform-style:preserve-3d}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fr1{position:absolute;inset:0;transform:rotateY(180deg)}
.fshadow{position:absolute;inset:6% 4% -2% 4%;background:rgba(0,0,0,.55);filter:blur(5px);z-index:-1;border-radius:6%}
.dust{position:absolute;left:50%;bottom:-12%;width:190%;aspect-ratio:80/60;translate:-50% 0;pointer-events:none;z-index:6;
  background:url(assets/v_dust.png) 0 0/600% 100% no-repeat;image-rendering:pixelated;animation:dust .5s steps(5,jump-none) forwards}
@keyframes dust{to{background-position:100% 0}}
#croupier{left:0;top:0;width:106%;max-width:none;z-index:22;pointer-events:none;filter:drop-shadow(-4px 8px 0 rgba(0,0,0,.45));will-change:transform}

/* fx */
.lunge0{animation:l0 .32s steps(4)}.lunge1{animation:l1 .32s steps(4)}
@keyframes l0{50%{transform:translateY(-18%)}}@keyframes l1{50%{transform:translateY(18%)}}
.hit{animation:hit .35s steps(5)}
@keyframes hit{20%{transform:translateX(-6%);filter:brightness(2.2) sepia(1) hue-rotate(-40deg)}60%{transform:translateX(6%)}}
.flip{animation:flip .3s steps(4)}
.land{animation:land .25s ease-out}@keyframes land{0%{transform:translateY(-8%) scale(1.06)}100%{transform:none}}@keyframes flip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.die{animation:die .45s steps(5) forwards}@keyframes die{to{transform:scale(.2) rotate(40deg);opacity:0}}
.flt{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:6.2cqw;pointer-events:none;z-index:30;white-space:nowrap;
  text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:flt .95s steps(8) forwards}
@keyframes flt{to{transform:translate(-50%,-170%);opacity:0}}
.vfx{position:absolute;left:50%;top:50%;width:150%;transform:translate(-50%,-50%) scale(.5);mix-blend-mode:screen;z-index:25;animation:vfx .6s steps(6) forwards}
@keyframes vfx{60%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
.shake{animation:hit .35s steps(5)}

/* screens */
.screen{position:absolute;inset:0;z-index:40;background:#0d0b09 center/100% 100% no-repeat}
#deckScreen{background-image:url(assets/deckbg.jpg)}
#logo{left:50%;top:.6%;width:25%;transform:translateX(-50%)}
.rules{position:absolute;left:5%;right:5%;top:14.6%;font-size:3.3cqw;line-height:1.05;background:rgba(8,6,5,.8);border-left:3px solid var(--blood);padding:1.2cqw 2.4cqw}
#dinfo{position:absolute;left:5%;right:5%;top:21.6%;height:6.4%;font-size:3.3cqw;line-height:1.02;background:rgba(8,6,5,.8);padding:1cqw 2.4cqw;overflow:hidden}
#dinfo strong{display:block;font-family:var(--display);font-size:2.4cqw;color:var(--bulb);font-weight:700;letter-spacing:.06em}
#dinfo em{font-style:normal;color:var(--muted)}
#dcount{left:5%;top:28.9%;font-family:var(--display);font-weight:700;font-size:3cqw;color:var(--bulb);text-shadow:2px 2px 0 #000}
#dgrid{left:4%;right:4%;top:32%;bottom:12.4%;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:2.6cqh 3%;padding:1cqh 1% 3cqh;scrollbar-width:thin;scrollbar-color:#6b5a3c transparent;-webkit-mask-image:linear-gradient(#000 90%,transparent)}
.dc{position:relative;cursor:pointer}
.dc.on .cd{filter:drop-shadow(0 0 3px var(--bulb)) drop-shadow(0 0 2px var(--bulb))}
.dc.on::after{content:"IN DECK";position:absolute;left:50%;bottom:-1.5cqh;white-space:nowrap;transform:translateX(-50%);font-family:var(--display);font-size:2.4cqw;color:#000;background:var(--bulb);padding:0 1.2cqw;font-weight:700}
.dc.off .cd{filter:brightness(.5)}
.dc.lock{cursor:default}
.dc.lock .cd{filter:grayscale(1) brightness(.35)}
.lockt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;font-family:var(--display);font-size:3cqw;color:var(--paper);text-shadow:1px 1px 0 #000;z-index:2;text-align:center}
.lockt img{width:40%}
#start{left:50%;bottom:1.6%;width:36%;transform:translateX(-50%)}
#start img{width:100%}
#start:disabled img{filter:grayscale(.6) brightness(.6)}

#endScreen.win{background-image:url(assets/win.jpg)}
#endScreen.lose{background-image:url(assets/lose.jpg)}
#endT{left:0;right:0;top:6%;text-align:center;font-family:var(--display);font-weight:700;font-size:12cqw;line-height:1;text-shadow:4px 4px 0 #000,0 0 18px rgba(0,0,0,.8)}
#endD{left:8%;right:8%;top:17%;text-align:center;font-size:4.6cqw;line-height:1.05;background:rgba(8,6,5,.75);padding:1.4cqw 2cqw}
#again{left:50%;bottom:11%;width:46%;transform:translateX(-50%)}
#again img{width:100%}
#edit{left:50%;bottom:4.5%;transform:translateX(-50%);font-size:3cqw;color:var(--paper);background:rgba(8,6,5,.8);border:2px solid var(--muted);padding:1.4cqw 3cqw}
/* ---------- menu ---------- */
#menu{background:#0d0b09;overflow:hidden;z-index:45}
#track{position:absolute;inset:0;display:flex;width:500%;transition:transform .38s cubic-bezier(.3,.8,.3,1);touch-action:pan-y}
.pane{position:relative;width:20%;height:100%;flex:none;overflow:hidden;background:#0d0b09 center/100% 100% no-repeat}
#pCards{background-image:url(assets/deckbg.jpg)}#pBattle{background-image:url(assets/alley.jpg)}#pShop{background-image:url(assets/shop.jpg)}#pGang,#pEvents{background-image:url(assets/deckbg.jpg)}
#pGang::after,#pEvents::after{content:"";position:absolute;inset:0;background:rgba(5,4,3,.62);pointer-events:none}
.pane::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.45),transparent 20%,transparent 66%,rgba(0,0,0,.6))}
#topbar{position:absolute;left:2%;right:2%;top:.8%;height:7.2%;background:url(assets/m_topbar.png) center/100% 100% no-repeat;display:flex;align-items:center;gap:1.6cqw;padding:0 4.4cqw;z-index:6}
.xpw{flex:1;min-width:0;display:flex;align-items:center;gap:1cqw}
.xp{flex:1;height:3.6cqw;background:#000;border:2px solid #000;box-shadow:0 0 0 1px #6b5a3c;position:relative;font-family:var(--display);font-size:2.2cqw;color:#fff;display:grid;place-items:center}
.xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#6fc0e8,#2f7fb0)}.xp b{position:relative;font-weight:400;text-shadow:1px 1px 0 #000}
.cur .plus{width:4.4cqw;height:4.4cqw;margin-left:.6cqw;display:grid;place-items:center;background:#4f9a32;border:1px solid #000;color:#fff;font-size:3.4cqw;line-height:1;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
#prof{position:absolute;left:2%;top:8.6%;width:58%;height:9.4%;display:flex;align-items:stretch;z-index:5;background:linear-gradient(90deg,rgba(60,14,12,.92),rgba(30,10,10,.85) 70%,rgba(30,10,10,0));clip-path:polygon(0 0,100% 0,88% 100%,0 100%);border-left:3px solid var(--blood);cursor:pointer}
#prof .av{width:24%;flex:none;background:#0e0a08 center 30%/150% auto no-repeat;image-rendering:pixelated;border-right:2px solid #000}
#prof .pt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1cqw;padding:0 3cqw}
#prof .pn{font-family:var(--display);font-weight:700;font-size:3.8cqw;color:var(--paper);text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prof .pn small{font-size:2.2cqw;color:var(--muted);margin-left:1.4cqw;font-weight:400}
#prof .ptro{display:flex;align-items:center;gap:1.4cqw;font-family:var(--display);font-weight:700;font-size:4.4cqw;color:var(--bulb);text-shadow:2px 2px 0 #000}
#prof .ptro img{width:6cqw}
#qbtns{position:absolute;right:2%;top:8.6%;display:flex;gap:1.8cqw;z-index:5}
.qb{width:12cqw;height:12cqw;display:grid;place-items:center;background:none;border:0}
.qb:active{transform:translateY(4%)}
.qb svg{width:62%;height:62%}
.qb img{width:100%;height:100%;image-rendering:pixelated}
#passBtn{position:absolute;right:2%;top:16.2%;width:38%;height:5.8%;display:flex;align-items:center;gap:2cqw;padding:0 2cqw;z-index:5;background:linear-gradient(#5a2a14,#2a1208);border:2px solid #000;box-shadow:inset 0 0 0 2px #8a5a20;text-align:left}
#passBtn img{height:82%}

.box{position:relative;width:100%;background:#1a120c;border:3px solid #000;box-shadow:0 0 0 2px #6b5a3c,0 10px 30px rgba(0,0,0,.6);padding:4cqw;animation:popin .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.box h3{margin:0 0 2cqw;font-family:var(--display);font-weight:700;font-size:4.4cqw;color:var(--bulb);text-shadow:2px 2px 0 #000;text-align:center}
.box p{margin:0 0 2cqw;font-size:4.2cqw;line-height:1.05}
.box .x{position:absolute;right:-3cqw;top:-3cqw;width:10cqw}.box .x img{width:100%}
.prow{display:flex;gap:4cqw;align-items:flex-start}
.prow .bigc{width:40%;flex:none}
.prow .txt{flex:1;min-width:0}

.btns{display:flex;gap:3cqw;justify-content:center;margin-top:3cqw;flex-wrap:wrap}
.b{font-family:var(--display);font-weight:700;font-size:3.4cqw;padding:2cqw 3.4cqw;border:3px solid #000;color:#fff;text-shadow:2px 2px 0 #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.22);display:inline-flex;align-items:center;gap:1.2cqw}
.b img{width:4.6cqw}
.b.y{background:#f0b92c;color:#2a1d00;text-shadow:none}.b.g{background:#4f9a32}.b.r{background:#b8321f}.b.p{background:#7c4fb0}
.b:disabled{filter:grayscale(.85) brightness(.55);cursor:default}
.loot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3cqw;margin:3cqw 0}
.loot>div{position:relative;opacity:0;animation:lootin .45s cubic-bezier(.2,1.4,.4,1) forwards}
.loot .q{position:absolute;right:-4%;bottom:-4%;font-family:var(--display);font-weight:700;font-size:3.4cqw;color:#fff;background:#3c7a24;border:2px solid #000;padding:0 1cqw}
@keyframes lootin{from{opacity:0;transform:translateY(30%) scale(.5)}to{opacity:1;transform:none}}
.caseBig{display:block;width:52%;margin:0 auto 2cqw;animation:hop 1s ease-in-out infinite}
.wheelBox{position:relative;width:86%;margin:2cqw auto 3cqw}
.wheelWrap{transform:scaleY(.74);transform-origin:50% 50%}
.wheelSq{width:100%;aspect-ratio:1}
.wheelSq img{width:100%;height:100%}
.ptr{position:absolute;left:50%;top:-4%;width:16%;translate:-50% 0;rotate:90deg;z-index:2;filter:drop-shadow(2px 2px 0 #000)}
#toast{position:absolute;left:50%;top:22%;translate:-50% 0;z-index:30;font-family:var(--display);font-weight:700;font-size:3.4cqw;color:#1a1000;background:var(--bulb);border:3px solid #000;padding:1.6cqw 3cqw;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

<script>
const C={
  gremlin:{n:'Gum Gremlin',f:'Gum Wad Gremlin',cost:1,atk:1,hp:2,role:'Pest',stick:1,t:'Sticky. Whatever it hits skips its next attack.'},
  pigeon:{n:'Pigeon Lawyer',f:'Pigeon Lawyer',cost:2,atk:2,hp:2,role:'Thief',thief:1,t:'Every hit steals 1 coin for your next round.'},
  fingers:{n:'Jar Fingers',f:'Fingers in a Jar',cost:2,atk:1,hp:4,role:'Multi',multi:3,t:'Pokes 3 times a turn. Useless against armor.'},
  ratking:{n:'Rat King',f:'Rat King of Chips',cost:3,atk:1,hp:3,role:'Swarm',t:'On reveal: fills all your empty slots with 1/1 rats.'},
  sandwich:{n:'Sandwich Knight',f:'Moldy Sandwich Knight',cost:3,atk:1,hp:4,role:'Poison',poison:2,t:'Hits poison: 2 damage next turn, then 1. Ignores armor.'},
  clown:{n:'Melted Clown',f:'Melted Clown',cost:3,atk:1,hp:3,role:'Splash',splash:1,t:'Hits ALL enemy cards. On death: HONK, enemy cards swap slots.'},
  grandma:{n:'Shotgun Granny',f:'Grandma with a Shotgun',cost:4,atk:5,hp:3,role:'Bruiser',t:'One huge shot. Wasted on tiny stuff like rats.'},
  toilet:{n:'Toilet Mimic',f:'Toilet Mimic',cost:4,atk:1,hp:7,role:'Tank',armor:1,t:'Armor 1: every hit deals 1 less. Poison gets through.'},
  dice:{n:'Uncle Dice',f:'Sweaty Uncle Dice',cost:2,atk:0,hp:3,role:'Luck',dice:1,t:'On reveal: rolls a die. Attack = the roll (1 to 6).'},
  blackhole:{n:'Black Hole',f:'Black Hole',cost:4,spell:1,role:'Spell',t:'On reveal: swallows BOTH middle cards. Yours too.'},
  rat:{n:'Rat',f:'Rat',cost:0,atk:1,hp:1,role:'Token',token:1,t:'A rat. It bites.'},
  golem:{n:'Slot Golem',f:'Slot Machine Golem',cost:6,atk:0,hp:0,role:'Legend',slot:1,leg:1,u:1,t:'On reveal: pulls its own lever. Attack and shield each roll 1 to 9.'},
  coinflip:{n:'Coin Flip',f:'Coin Flip',cost:2,spell:1,role:'Spell',u:1,t:'Flips a coin for each of your cards: heads +2 attack, tails -1 shield.'},
  gator:{n:'Gator Busboy',f:'Sewer Gator Busboy',cost:4,atk:3,hp:4,role:'Eater',eat:1,u:1,t:'When it kills a card it eats it, gaining half of that card\'s shield.'},
  roach:{n:'Roach Bride',f:'Cockroach Bride',cost:1,atk:1,hp:1,role:'Undying',revive:1,u:1,t:'Comes back once, with 1 shield, after dying.'},
  leech:{n:'Leech Clerk',f:'Leech Accountant',cost:2,atk:1,hp:3,role:'Drain',drain:1,u:1,t:'Heals your HP by the damage it deals.'},
  jukebox:{n:'Jukebox',f:'Rotten Jukebox',cost:3,atk:0,hp:5,role:'Support',juke:1,u:1,t:'Each turn plays a cursed song: a random ally gets +1 attack.'},
  smell:{n:'Bad Smell',f:'Bad Smell',cost:1,spell:1,role:'Spell',u:2,t:'On reveal: the enemy cards stumble into random slots.'},
  vending:{n:'Vending Beast',f:'Broken Vending Machine',cost:4,atk:3,hp:4,role:'Payout',payout:1,u:2,t:'When destroyed, spits out 3 coins for your next round.'},
  karaoke:{n:'Karaoke Ghoul',f:'Karaoke Ghoul',cost:4,atk:2,hp:3,role:'Splash',splash:1,scream:1,u:2,t:'Screams at ALL enemy cards. Also deals 1 to its own neighbors.'},
  bellhop:{n:'Bomb Bellhop',f:'Bomb Bellhop',cost:3,atk:1,hp:2,role:'Bomb',bomb:3,u:2,t:'On death: explodes for 3 damage on the card in front.'},
  mannequin:{n:'Mannequin',f:'Pawnshop Mannequin',cost:3,atk:0,hp:6,role:'Guard',guard:1,u:2,t:'Its neighbors take 1 less damage from every hit.'},
  mafioso:{n:'Mafioso',f:'Mustache Mafioso',cost:5,atk:4,hp:5,role:'Fast',fast:1,u:3,t:'Fast: shoots before everyone else each turn.'},
  rabbit:{n:"Rabbit's Foot",f:"Lucky Rabbit's Foot",cost:2,spell:1,role:'Spell',u:3,t:'A random card of yours gets +2/+2. One time in four, it dies instead.'},
  lastcall:{n:'Last Call',f:'Last Call',cost:3,spell:1,role:'Spell',u:3,t:'Every card on the table takes 2 damage. Armor does not help.'}
};
for(const k in C)if(C[k].u==null)C[k].u=0;
const ALL=Object.keys(C).filter(k=>!C[k].token);
const ROUNDS=5,START_HP=20;
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let PAUSED=false;
const sleep=ms=>new Promise(r=>{const m=S;const tick=()=>{if(m&&m.dead)return;if(PAUSED)return setTimeout(tick,120);r()};setTimeout(tick,ms)});
const $=id=>document.getElementById(id);

function frameOf(id){const d=C[id];return d.spell?'spell':d.token?'token':d.leg?'legend':'common'}
function cardHTML(id,inst,lvl){
  const d=C[id],fr=frameOf(id);
  let h=`<div class="cd ${fr}"><img class="fr" src="assets/f_${fr}.png" alt=""><img class="art" src="assets/c_${id}.png" alt="">`;
  if(!inst||inst.fresh)h+=`<span class="cost">${d.cost}</span>`;
  h+=`<span class="nm">${d.n}</span>`;
  if(!d.spell){
    const bs=statsFor(id,lvl||1),atk=inst&&!(d.slot&&inst.fresh)?inst.atk:(d.dice||d.slot?'?':bs.atk),hp=inst&&!(d.slot&&inst.fresh)?inst.hp:(d.slot?'?':bs.hp);
    h+=`<span class="st atk">${atk}</span><span class="st hpv">${hp}</span>`;
    if(inst){let ch='';
      if(d.armor)ch+=`<span class="chip"><img src="assets/u_armor.png" alt="">${d.armor}</span>`;
      if(inst.poison>0)ch+=`<span class="chip"><img src="assets/u_skull.png" alt="">${inst.poison}</span>`;
      if(inst.stuck>0)ch+=`<span class="chip"><img src="assets/u_gum.png" alt=""></span>`;
      if(d.revive&&!inst.revived)ch+=`<span class="chip">x2</span>`;
      if(ch)h+=`<div class="chips">${ch}</div>`}
  }
  const L=inst?inst.lvl:lvl;if(L&&!d.token)h+=`<span class="lv">LV${L}</span>`;
  return h+'</div>';
}
const BACK='<div class="cd"><img class="back" src="assets/back.png" alt="Face-down card"></div>';
function infoHTML(id){const d=C[id];return `<strong>${d.f.toUpperCase()} · ${d.role.toUpperCase()}</strong>${d.t}${d.spell?` <em>${d.cost} coins</em>`:` <em>${d.dice||d.slot?'?':d.atk} atk, ${d.slot?'?':d.hp} shield, ${d.cost} coins</em>`}`}
let infoT=null;function setInfo(html,quiet){$('infotext').innerHTML=html;if(quiet)return;const b=$('info');b.style.opacity=1;clearTimeout(infoT);infoT=setTimeout(()=>{b.style.opacity=0},3200)}

/* dealer moods: 0 idle, 1 laugh, 2 angry, 3 shocked */
let moodT=null;
let DPRE='dealer';
function mood(m,ms){const el=$('dealer');el.src=`assets/${DPRE}${m}.png`;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),200);
  clearTimeout(moodT);if(ms)moodT=setTimeout(()=>{el.src=`assets/${DPRE}0.png`},ms)}

/* smoke puffs */
document.querySelectorAll('.smoke').forEach(e=>{for(let i=0;i<8;i++){const p=document.createElement('span');const d=3.2+Math.random()*1.6;
  p.style.setProperty('--d',d+'s');p.style.setProperty('--dl',(-i*d/8)+'s');p.style.setProperty('--x',(Math.random()*8-2)+'cqw');e.appendChild(p)}});

/* ---------- deck ---------- */
let deck=[],S=null,uid=0;
try{const s=JSON.parse(localStorage.getItem('dd-deck')||'null');if(Array.isArray(s)&&s.length===6&&s.every(x=>ALL.includes(x)))deck=s}catch(_){}
if(!deck.length)deck=['gremlin','fingers','ratking','sandwich','grandma','toilet'];
function mk(id,side){const d=C[id],l=d.token?1:side===0?P.cards[id].l:(S&&S.elvl)||1,st=statsFor(id,l);const o={uid:++uid,id,side,lvl:l,atk:st.atk,hp:st.hp,poison:0,stuck:0,fresh:true,hidden:true};if(side===1&&S&&S.arena===3&&!d.spell)o.hp+=1;return o}

$('again').onclick=()=>{$('endScreen').hidden=true;newMatch()};
$('edit').onclick=()=>{$('endScreen').hidden=true;openMenu(2)};

/* ---------- profile ---------- */
const ARENAS=[
 {t:0,n:'THE BACK ROOM',who:'The Dealer',pre:'dealer',bg:'table.jpg',tw:'',g:{tilt:38,shift:0,r1w:18,r1t:35,r1:[20.8,41,61.2],r0w:21.5,r0t:47.5,r0:[13.9,39.25,64.6],dt:12.6,dh:23.8,gl:[22.1,13.8]}},
 {t:100,n:'THE DRAIN',who:'The Croc',pre:'d2_',bg:'table2.jpg',tw:'Poison lasts 1 turn longer down here.',g:{tilt:52,shift:0,r1w:16.5,r1t:41.86,r1:[22.11,42.93,63.75],r0w:19,r0t:50.52,r0:[18.23,41.33,64.44],dt:21.6,dh:23.6,gl:[19.5,25.4]}},
 {t:250,n:'THE ROOFTOP',who:'The Collector',pre:'d3_',bg:'table3.jpg',tw:'Lightning may strike a random card for 3.',g:{tilt:52,shift:-4.8,r1w:15.5,r1t:42.37,r1:[25.58,42.81,60.03],r0w:19,r0t:50.08,r0:[19.72,41.56,63.41],dt:25.8,dh:18.4,gl:[15,16.3]}},
 {t:500,n:'THE VAULT',who:'The Owner',pre:'d4_',bg:'table4.jpg',tw:"The Owner's cards start with +1 shield.",g:{tilt:38,shift:0,r1w:18,r1t:35.23,r1:[21,41.77,62.54],r0w:21.5,r0t:47.78,r0:[13.23,39.61,65.98],dt:14.4,dh:21.2,gl:[22.8,14.2]}}];
let TILT=38;
function applyArena(k){
  const A=ARENAS[k],g=A.g,st=$('stage');
  st.classList.remove('a1','a2','a3','a4');st.classList.add('a'+(k+1));
  const v={'--tilt':g.tilt+'deg','--r1w':g.r1w+'%','--r1t':g.r1t+'%','--r1a':g.r1[0]+'%','--r1b':g.r1[1]+'%','--r1c':g.r1[2]+'%','--r0w':g.r0w+'%','--r0t':g.r0t+'%','--r0a':g.r0[0]+'%','--r0b':g.r0[1]+'%','--r0c':g.r0[2]+'%'};
  for(const n in v)st.style.setProperty(n,v[n]);
  TILT=g.tilt;
  const bg=$('bg');bg.style.backgroundImage=`url(assets/${A.bg})`;bg.style.top=g.shift+'%';
  const dw=$('dealerWrap');dw.style.top=g.dt+'%';dw.style.height=g.dh+'%';
  const gl=$('glow');gl.style.left=g.gl[0]+'%';gl.style.top=g.gl[1]+'%';
  $('flick').style.background=`radial-gradient(ellipse at ${g.gl[0]}% ${g.gl[1]}%,rgba(0,0,0,.2),rgba(0,0,0,.55))`;
  DPRE=A.pre;$('dealer').src=`assets/${DPRE}0.png`;
}
const UP={1:{n:2,g:50},2:{n:4,g:150},3:{n:10,g:400},4:{n:20,g:1000}};
const CASES=[{n:'Cardboard Box',t:20,cards:3,gold:[15,30],chips:0},{n:'Leather Briefcase',t:60,cards:6,gold:[40,70],chips:0},{n:'Steel Safe',t:180,cards:12,gold:[100,160],chips:3},{n:'Golden Suitcase',t:480,cards:25,gold:[250,400],chips:10}];
const DEF_DECK=['gremlin','fingers','ratking','sandwich','grandma','toilet'];

const unlocked=id=>C[id].u<=P.best;

const fmt=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m>=60?`${Math.floor(m/60)}h ${m%60}m`:m?`${m}:${String(r).padStart(2,'0')}`:`${r}s`};

function chipCost(c){const rem=c.at?(c.at-Date.now())/1000:CASES[c.k].t;return Math.max(1,Math.ceil(rem/60)*2)}
function tapCase(i){

function grantCards(total){

  for(const id in out)P.cards[id].n+=out[id];return out;
}

}

function buy(i){const it=P.deals.items[i];if(it.sold)return;

  if(P.gold<it.p){toast('NOT ENOUGH GOLD');return}P.gold-=it.p;P.cards[it.id].n+=it.q;it.sold=true;saveP();toast(`+${it.q} ${C[it.id].n.toUpperCase()}`);renderMenu()}

const RL=(()=>{
  const ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

  const CHIPPED=new Set(Array.from({length:6},()=>Math.floor(rnd2()*37)));
  let wA=0,bA=-Math.PI/2,bR=TRACK,showBall=false,idleT=performance.now();
  const freeReady=()=>DAY-(Date.now()-P.spin)<=0;
  const total=()=>Object.values(bets).reduce((a,b)=>a+b,0);
  function drawWheel(){

    g.fillStyle='rgba(20,12,6,.85)';g.beginPath();g.arc(C,C,48,0,7);g.fill();
    for(let i=0;i<37;i++){const a0=wA+i*SEG-SEG/2-Math.PI/2;g.strokeStyle='#5a4418';g.beginPath();g.moveTo(C+Math.cos(a0)*38,C+Math.sin(a0)*38);g.lineTo(C+Math.cos(a0)*48,C+Math.sin(a0)*48);g.stroke()}
    const gr=g.createRadialGradient(C-8,C-8,3,C,C,38);gr.addColorStop(0,'#6a4524');gr.addColorStop(1,'#25150a');
    g.fillStyle=gr;g.beginPath();g.arc(C,C,37,0,7);g.fill();
    for(const st of STAINS){const a=wA+st.a;g.fillStyle=st.c;g.beginPath();g.arc(C+Math.cos(a)*st.r,C+Math.sin(a)*st.r,st.s,0,7);g.fill()}
    if(tur.complete&&tur.naturalWidth){g.save();g.translate(C,C);g.rotate(wA);g.drawImage(tur,-38,-38,76,76);g.restore()}
  }
  function drawBall(){
    bg.clearRect(0,0,W,W);if(!showBall)return;
    const x=C+Math.cos(bA)*bR,y=C+Math.sin(bA)*bR;
    bg.fillStyle='rgba(0,0,0,.5)';bg.beginPath();bg.arc(x+1.5,y+2,4,0,7);bg.fill();
    bg.fillStyle='#d6cba6';bg.beginPath();bg.arc(x,y,3.8,0,7);bg.fill();
    bg.fillStyle='#8a7a4a';bg.fillRect(x,y+1,2,1.4);bg.fillStyle='#f3ecd2';bg.fillRect(x-2,y-2,1.6,1.6);
  }
  function draw(){drawWheel();drawBall()}
  function idle(t){if(!spinning){wA+=(t-idleT)*0.00016;draw()}idleT=t;requestAnimationFrame(idle)}
  function board(){
    const b=$('rBoard');b.innerHTML='';let k=0;
    const cell=(key,label,cls)=>{const e=document.createElement('button');e.type='button';e.className='rc '+cls;e.textContent=label;e.dataset.k=key;
      const sx=(k*37)%100,sy=(k*53)%100;k++;
      e.style.backgroundImage=`radial-gradient(circle at ${sx}% ${sy}%,rgba(20,10,4,.55) 0 14%,transparent 16%),radial-gradient(circle at ${(sx+48)%100}% ${(sy+31)%100}%,rgba(140,120,70,.18) 0 9%,transparent 11%),linear-gradient(170deg,rgba(255,255,255,.04),rgba(0,0,0,.25))`;
      if(bets[key])e.innerHTML+=`<i style="background-image:url(assets/${chipImg(bets[key])}.png)">${bets[key]}</i>`;
      if(last!=null&&(key==='n'+last||(key==='red'&&col(last)==='rd')||(key==='black'&&col(last)==='bk')))e.classList.add('hit');
      e.onclick=()=>place(key);b.appendChild(e)};
    cell('n0','0 · GREEN ×36','gr');
    for(let n=1;n<=36;n++)cell('n'+n,n,col(n));
    cell('red','RED ×2','rd wide');cell('black','BLACK ×2','bk wide');
  }
  function chips(){const c=$('rChips');c.innerHTML='';CHIPS.forEach(ch=>{const e=document.createElement('button');e.type='button';e.className='chp'+(ch.v===chip?' on':'');e.style.backgroundImage=`url(assets/${ch.i}.png)`;e.textContent=ch.v;e.setAttribute('aria-label',`Bet ${ch.v} gold`);e.onclick=()=>{chip=ch.v;chips()};c.appendChild(e)})}
  function info(){
    const t=total(),fr=freeReady(),cost=Math.max(0,t-(fr?FREE:0));
    $('rInfo').innerHTML=`${fr?`<span class="fr">FREE: ${FREE} ON THE HOUSE</span>`:`FREE SPIN IN ${fmt((DAY-(Date.now()-P.spin))/1000)}`}<br>BET <b>${t}</b>`;
    const sp=$('rSpin');sp.disabled=spinning||t===0||cost>P.gold;sp.textContent=spinning?'…':t===0?'BET FIRST':cost>P.gold?'NO GOLD':cost?`SPIN ${cost}`:'SPIN FREE';
    $('rClear').disabled=spinning||t===0;
    $('rHist').innerHTML=hist.map(n=>`<span style="background:${HC[col(n)]}">${n}</span>`).join('');
  }
  function refresh(){board();info()}
  function place(k){if(spinning)return;const t=total(),fr=freeReady();if(Math.max(0,t+chip-(fr?FREE:0))>P.gold){toast('NOT ENOUGH GOLD');return}
    if(last!=null){last=null;$('rRes').hidden=true}
    bets[k]=(bets[k]||0)+chip;refresh()}
  $('rClear').onclick=()=>{if(spinning)return;bets={};last=null;$('rRes').hidden=true;refresh()};
  /* croupier hand */
  const H=$('rHand'),pane=$('pEvents');let hp={x:0,y:0};
  const pr=el=>{const a=pane.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-a.left,y:r.top-a.top,w:r.width,h:r.height}};
  async function hmove(x,y,d){const a=H.animate([{transform:`translate(${hp.x}px,${hp.y}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:d,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});hp={x,y};await a.finished.catch(()=>{})}
  const tip=(x,y)=>({x,y:y-H.offsetHeight*.85});
  async function handIn(x,y,d=420){const pw=pane.clientWidth,ph=pane.clientHeight;H.hidden=false;hp={x:pw*1.05,y:y-H.offsetHeight*.85};H.style.transform=`translate(${hp.x}px,${hp.y}px)`;const t=tip(x,y);await hmove(t.x,t.y,d)}
  async function handOut(d=380){const pw=pane.clientWidth;await hmove(pw*1.1,hp.y+20,d);H.hidden=true}
  /* cockroach */
  function roach(){const r=$('rRoach');if(spinning||tab!==4||!r.hidden||Math.random()<.4)return;
    const pw=pane.clientWidth,ph=pane.clientHeight,L=Math.random()<.5;
    const y0=ph*(.55+Math.random()*.25),y1=y0+(Math.random()-.5)*ph*.2,x0=L?-pw*.1:pw*1.05,x1=L?pw*1.05:-pw*.1;
    const ang=Math.atan2(y1-y0,x1-x0)*180/Math.PI+90;r.hidden=false;
    const mid=.35+Math.random()*.3;
    const a=r.animate([{transform:`translate(${x0}px,${y0}px) rotate(${ang}deg)`},{transform:`translate(${x0+(x1-x0)*mid}px,${y0+(y1-y0)*mid}px) rotate(${ang+8}deg)`,offset:.45},{transform:`translate(${x0+(x1-x0)*mid}px,${y0+(y1-y0)*mid}px) rotate(${ang-10}deg)`,offset:.6},{transform:`translate(${x1}px,${y1}px) rotate(${ang}deg)`}],{duration:5200,easing:'linear'});
    a.finished.then(()=>{r.hidden=true}).catch(()=>{r.hidden=true})}
  setInterval(roach,9000);
  const easeOut=t=>1-Math.pow(1-t,3);
  $('rSpin').onclick=async()=>{
    const t=total();if(spinning||!t)return;const fr=freeReady(),cost=Math.max(0,t-(fr?FREE:0));if(cost>P.gold)return;
    P.gold-=cost;if(fr)P.spin=Date.now();saveP();renderTop();
    spinning=true;$('rRes').hidden=true;last=null;refresh();
    const res=Math.floor(Math.random()*37),idx=ORDER.indexOf(res);
    const D=5800,w0=wA,wSpin=Math.PI*2*(2.2+Math.random()*.6);
    const wEnd=w0+wSpin,bEnd=wEnd+idx*SEG-Math.PI/2,turns=5+Math.floor(Math.random()*2);
    const bStart=bEnd+Math.PI*2*turns+Math.PI*(-.25-((bEnd%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/(Math.PI*2)*0);
    // croupier drops the ball at the ball's start point
    const wr=pr($('rWheel')),sc=wr.w/W,sa=bStart;const bx=wr.x+(C+Math.cos(sa)*TRACK)*sc,by=wr.y+(C+Math.sin(sa)*TRACK)*sc;
    try{SND.duck(.35,.4)}catch(_){}
    await handIn(bx,by,450);bA=sa;bR=TRACK;showBall=true;draw();await sleepR(120);handOut(360);
    const t0=performance.now();
    function step(now){let u=Math.min(1,(now-t0)/D);const e=easeOut(u);
      wA=w0+wSpin*e;
      const free=bEnd+(bStart-bEnd)*(1-easeOut(Math.min(1,u/0.86)));
      const ride=wA+idx*SEG-Math.PI/2,s=u<.7?0:Math.min(1,(u-.7)/.2);
      bA=free*(1-s)+ride*s;
      bR=u<.55?TRACK:u<.8?TRACK-(TRACK-POCK)*((u-.55)/.25)+Math.abs(Math.sin(u*55))*5*(1-(u-.55)/.25):POCK;
      draw();
      if(u<1)requestAnimationFrame(step);else finish(res)}
    requestAnimationFrame(step);
  };
  const sleepR=ms=>new Promise(r=>setTimeout(r,ms));
  async function finish(res){
    last=res;hist=[res,...hist].slice(0,9);try{localStorage.setItem('dd-rh',JSON.stringify(hist))}catch(_){}
    let win=0;const lose=[];for(const k in bets){const v=bets[k];let w=0;if(k==='n'+res)w=v*36;else if(k==='red'&&col(res)==='rd')w=v*2;else if(k==='black'&&col(res)==='bk')w=v*2;win+=w;if(!w)lose.push(k)}
    const r=$('rRes');r.hidden=false;r.style.background=HC[col(res)];r.textContent=res;
    board();
    const nm=`${res} ${res===0?'GREEN':REDS.has(res)?'RED':'BLACK'}`;
    // hand sweeps the losing chips off the felt
    if(lose.length){await sleepR(500);const br=pr($('rBoard'));
      await handIn(br.x+br.w*.08,br.y+br.h*.55,480);
      const els=lose.map(k=>document.querySelector(`.rc[data-k="${k}"] i`)).filter(Boolean);
      els.forEach(e=>e.animate([{transform:'none',opacity:1},{transform:`translateX(${pane.clientWidth*.7}px) rotate(200deg)`,opacity:0}],{duration:520,easing:'cubic-bezier(.5,0,.8,.6)',fill:'forwards'}));
      await handOut(520)}
    P.gold+=win;addXP(win?8:3);saveP();renderTop();
    toast(win?`${nm} · YOU WIN ${win} GOLD!`:`${nm} · THE HOUSE WINS`);if(win)SND.sting('win',.7);
    try{SND.duck(.6,1)}catch(_){}
    spinning=false;bets={};refresh();
  }
  chips();refresh();draw();tur.onload=draw;requestAnimationFrame(t=>{idleT=t;idle(t)});
  return{refresh:info};
})();

/* ---------- sound ---------- */
const SND=(()=>{
  let ctx=null,master=null,cur=null,curName=null,want=null;const bufs={},loading={};
  let on=true;try{on=localStorage.getItem('dd-sound')!=='off'}catch(_){}
  const paint=()=>document.querySelectorAll('.snd:not(#pauseB)').forEach(b=>{b.classList.toggle('off',!on);b.setAttribute('aria-pressed',String(on))});
  function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=on?1:0;master.connect(ctx.destination);if(want)music(want)}
  function load(n){if(bufs[n])return Promise.resolve(bufs[n]);if(loading[n])return loading[n];
    return loading[n]=fetch(`assets/m_${n}.mp3`).then(r=>r.arrayBuffer()).then(a=>new Promise((ok,no)=>ctx.decodeAudioData(a,ok,no))).then(b=>bufs[n]=b).catch(()=>null)}
  function fadeOut(node,t){if(!node)return;const g=node.g.gain,n=ctx.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(0,n+t);setTimeout(()=>{try{node.src.stop()}catch(_){}},t*1000+80)}
  async function music(n,vol=.6){want=n;if(!ctx)return;if(curName===n&&cur){const g=cur.g.gain,t=ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(vol,t+.8);return}
    const b=await load(n);if(!b||want!==n)return;
    fadeOut(cur,1.4);const src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=b;src.loop=true;g.gain.value=0;src.connect(g);g.connect(master);src.start();
    g.gain.linearRampToValueAtTime(vol,ctx.currentTime+1.6);cur={src,g};curName=n}
  function duck(vol,t=.6){if(!ctx||!cur)return;const g=cur.g.gain,n=ctx.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(vol,n+t)}
  async function sting(n,vol=.9){if(!ctx)return;const b=await load(n);if(!b)return;const src=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=vol;src.buffer=b;src.connect(g);g.connect(master);src.start()}
  function toggle(){on=!on;try{localStorage.setItem('dd-sound',on?'on':'off')}catch(_){}init();if(ctx){if(ctx.state==='suspended')ctx.resume();master.gain.setTargetAtTime(on?1:0,ctx.currentTime,.05)}paint()}
  const unlock=()=>{init();if(ctx&&ctx.state==='suspended')ctx.resume()};
  ['pointerdown','touchend','keydown'].forEach(e=>addEventListener(e,unlock,{capture:true,passive:true}));
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume()});
  document.querySelectorAll('.snd:not(#pauseB)').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggle()}));
  paint();
  return{music,duck,sting,toggle,isOn:()=>on};
})();

const slotEls=[[],[]];
(function(){const box=$('slots');for(const s of[0,1])for(let i=0;i<3;i++){const el=document.createElement('div');el.className=`slot r${s} c${i}`;el.tabIndex=0;el.onclick=()=>tapSlot(s,i);box.appendChild(el);slotEls[s][i]=el}})();
const slotEl=(s,i)=>slotEls[s][i];

/* ---------- match ---------- */
function newMatch(){
  const ar=P.sel;applyArena(ar);SND.music('a'+(ar+1));
  S={arena:ar,round:1,hp:[START_HP,START_HP],coins:[0,0],bonus:[0,0],board:[[null,null,null],[null,null,null]],pile:[shuffle(deckNow()),shuffle(shuffle(ALL.filter(id=>C[id].u<=ar)).slice(0,6))],hand:[],sel:null,phase:'plan',elvl:Math.min(6,Math.max(ar+1,1+Math.floor(P.trophies/80)))};
  mood(0);startRound();
}
function startRound(){
  S.phase='plan';S.sel=null;
  for(const s of[0,1]){S.coins[s]=S.round+2+S.bonus[s];S.bonus[s]=0}
  S.hand=S.pile[0].splice(0,4).map(id=>({id,used:false}));
  enemyPlan();
  log(`ROUND ${S.round}: PLACE CARDS`);
  setInfo('<strong>YOUR MOVE</strong>Tap a card in your hand, then tap one of your glowing slots.',true);$('info').style.opacity=0;
  dealIn();
}
function enemyPlan(){
  const hand=S.pile[1].splice(0,4);
  for(const id of shuffle(hand)){
    const empty=[0,1,2].filter(i=>!S.board[1][i]);if(!empty.length)break;
    const d=C[id];if(d.cost>S.coins[1])continue;
    if(id==='blackhole'&&!S.board[0][1]&&Math.random()<.6)continue;
    if((id==='rabbit'||id==='coinflip')&&!S.board[1].some(Boolean)&&Math.random()<.7)continue;
    const facing=empty.filter(i=>S.board[0][i]);
    const lane=(facing.length&&Math.random()<.6)?facing[rnd(facing.length)]:empty[rnd(empty.length)];
    S.board[1][lane]=mk(id,1);S.coins[1]-=d.cost;
  }
  S.pile[1].push(...hand);
}

/* ---------- input ---------- */
function tapHand(k){
  if(S.phase!=='plan'||S.hand[k].used)return;
  S.sel=S.sel===k?null:k;const id=S.hand[k].id;
  setInfo(infoHTML(id)+(C[id].cost>S.coins[0]?' <em>Not enough coins.</em>':''));render();
}
function tapSlot(s,i){
  if(!S||S.busy)return;const c=S.board[s][i];
  if(S.phase!=='plan'){if(c&&!c.hidden)setInfo(infoHTML(c.id));return}
  if(s===1){setInfo(c?(c.hidden?'<strong>FACE DOWN</strong>The Dealer placed something here. You find out at the reveal.':infoHTML(c.id)):'<strong>EMPTY LANE</strong>Your card here hits the Dealer directly.');return}
  if(c&&c.fresh){S.hand[c.handIdx].used=false;S.coins[0]+=C[c.id].cost;S.board[0][i]=null;setInfo('<strong>TAKEN BACK</strong>Card returned to your hand.');render();return}
  if(c){setInfo('<strong>SURVIVOR</strong>'+C[c.id].t+' It stays until it dies.');return}
  if(S.sel==null){setInfo('<strong>EMPTY SLOT</strong>Pick a card from your hand first.');return}
  const hc=S.hand[S.sel],d=C[hc.id];
  if(d.cost>S.coins[0]){setInfo(infoHTML(hc.id)+' <em>Not enough coins.</em>');return}
  const from=stageRect($('hand').children[S.sel]);
  const inst=mk(hc.id,0);inst.handIdx=S.sel;inst.landing=true;S.board[0][i]=inst;hc.used=true;S.coins[0]-=d.cost;S.sel=null;
  setInfo(`<strong>PLACED FACE DOWN</strong>${d.f}. Tap it to take it back.`);render();
  S.busy=(S.busy||0)+1;fly(from,slotEl(0,i),cardHTML(hc.id),BACK,680,true).then(()=>{inst.landing=false;S.busy--;render();landFx(0,i)});
}
$('fight').onclick=()=>{if(S&&S.phase==='plan'&&!S.busy)battle()};

/* ---------- motion ---------- */
function stageRect(el){const s=$('stage').getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height}}
const T=(x,y,r,sc,ry,rx)=>`perspective(900px) translate(${x}px,${y}px) rotate(${r}deg) scale(${sc}) rotateY(${ry}deg) rotateX(${rx}deg)`;
async function fly(from,toEl,startHTML,endHTML,dur,flip){
  const to=stageRect(toEl),w=to.w,h=w*530/312;
  const f=document.createElement('div');f.className='fly';f.style.width=w+'px';
  f.innerHTML=`<div class="f3"><div class="face fr0">${startHTML}</div><div class="face fr1">${endHTML}</div></div><div class="fshadow"></div>`;
  const sx=from.x+from.w/2-w/2,sy=from.y+from.h/2-h/2,ex=to.x,ey=to.y+to.h-h,s0=from.w/w;
  $('stage').appendChild(f);
  const mx=sx+(ex-sx)*.55,my=Math.min(sy,ey)-h*.45;
  const ease='cubic-bezier(.5,0,.25,1)';
  const a=f.animate([
    {transform:T(sx,sy,0,s0,0,0)},
    {transform:T(mx,my,flip?-7:6,(s0+1)/2*1.12,0,10),offset:.45},
    {transform:T(ex,ey-h*.05,0,1.04,0,30),offset:.82},
    {transform:T(ex,ey,0,1,0,TILT)}],{duration:dur,easing:ease});
  f.querySelector('.fshadow').animate([{opacity:.15,transform:'translate(0,0) scale(.9)'},{opacity:.5,transform:'translate(10%,22%) scale(1.05)',offset:.45},{opacity:.65,transform:'translate(2%,4%) scale(1)'}],{duration:dur,easing:ease});
  if(flip)f.querySelector('.f3').animate([{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}],{duration:dur*.7,easing:'cubic-bezier(.45,0,.2,1)',fill:'forwards'});
  await a.finished.catch(()=>{});f.remove();
}
function dust(el){const d=document.createElement('div');d.className='dust';el.appendChild(d);setTimeout(()=>d.remove(),520)}
function landFx(s,i){const c=cardOf(s,i);if(c)c.animate([{transform:'translateY(-5%) scale(1.05)'},{transform:'translateY(1.5%) scale(.985,1)',offset:.55},{transform:'none'}],{duration:280,easing:'cubic-bezier(.2,.8,.3,1)'});dust(slotEl(s,i))}
async function dealIn(){
  S.phase='deal';S.busy=(S.busy||0)+1;
  const lanes=[0,1,2].filter(i=>S.board[1][i]&&S.board[1][i].fresh);
  lanes.forEach(i=>S.board[1][i].landing=true);render();
  if(lanes.length){log('THE DEALER DEALS…');await sleep(250)}
  for(const i of lanes){
    const d=stageRect($('dealer')),w=d.w*.42;
    const from={x:d.x+d.w/2-w/2+(Math.random()*20-10),y:d.y+d.h*.8,w,h:w*530/312};
    $('dealer').classList.add('bump');setTimeout(()=>$('dealer').classList.remove('bump'),200);
    await fly(from,slotEl(1,i),BACK,BACK,620,false);
    S.board[1][i].landing=false;render();landFx(1,i);await sleep(140);
  }
  S.busy--;S.phase='plan';log(`ROUND ${S.round}: PLACE CARDS`);render();
}
/* croupier hand */
let noHand=false,handPos={x:0,y:0};
$('croupier').onerror=()=>{noHand=true};
async function handMove(x,y,dur){const h=$('croupier');const a=h.animate([{transform:`translate(${handPos.x}px,${handPos.y}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:dur,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});handPos={x,y};await a.finished.catch(()=>{})}
function handAt(el){const r=stageRect(el),h=$('croupier').offsetHeight;return{x:r.x+r.w*.42,y:r.y+r.h*.55-h*.85}}
async function flipSlot(s,i){
  const el=cardOf(s,i);if(!el)return;
  await el.animate([{transform:'perspective(500px) rotateY(0deg) translateZ(0) scale(1)'},{transform:'perspective(500px) rotateY(90deg) translateZ(14px) scale(1.08)'}],{duration:210,easing:'cubic-bezier(.55,0,.9,.4)'}).finished.catch(()=>{});
  S.board[s][i].hidden=false;render();
  const n=cardOf(s,i);if(n){n.animate([{transform:'perspective(500px) rotateY(-90deg) translateZ(14px) scale(1.08)',filter:'brightness(1.8)'},{transform:'perspective(500px) rotateY(8deg) translateZ(4px) scale(1.02)',filter:'brightness(1.15)',offset:.7},{transform:'perspective(500px) rotateY(0deg) translateZ(0) scale(1)',filter:'brightness(1)'}],{duration:340,easing:'cubic-bezier(.15,.6,.35,1)'})}
}
async function flipAll(){
  const order=[];for(let i=0;i<3;i++)for(const s of[1,0]){const c=S.board[s][i];if(c&&c.hidden)order.push([s,i])}
  if(!order.length)return;
  const H=$('croupier'),st=stageRect($('stage'));
  if(!H.complete||!H.naturalWidth)noHand=true;
  if(!noHand){H.hidden=false;handPos={x:st.w*1.05,y:st.h*.36};H.style.transform=`translate(${handPos.x}px,${handPos.y}px)`}
  for(const[s,i]of order){
    if(!noHand){const p=handAt(slotEl(s,i));await handMove(p.x,p.y,300);await handMove(p.x-4,p.y+6,70);handMove(p.x+6,p.y-10,160)}else await sleep(140);
    await flipSlot(s,i);await sleep(110);
  }
  if(!noHand){await handMove(st.w*1.1,st.h*.55,320);H.hidden=true}
}

/* ---------- battle ---------- */
async function battle(){
  S.phase='battle';S.sel=null;
  S.hand.forEach(h=>S.pile[0].push(h.id));S.hand=[];
  render();log('THE CROUPIER FLIPS…');await sleep(250);
  await flipAll();
  await sleep(300);
  for(const s of[0,1])for(let i=0;i<3;i++){const c=S.board[s][i];if(c&&C[c.id].spell){S.board[s][i]=null;render();await cast(c,s)}}
  for(const s of[0,1])for(let i=0;i<3;i++){
    const c=S.board[s][i];if(!c||!c.fresh)continue;
    if(c.id==='golem'){c.fresh=false;c.atk=1+rnd(9)+Math.floor((c.lvl-1)/2);c.hp=1+rnd(9)+(c.lvl-1)+(s===1&&S.arena===3?1:0);c.fresh=true;render();const el=slotEl(s,i);float(el,`${c.atk} / ${c.hp}`,'#f0c95c');vfx(el,'coins');log(`SLOT GOLEM ROLLED ${c.atk} / ${c.hp}`);await sleep(800)}
    if(c.id==='dice'){c.atk=1+rnd(6);render();float(slotEl(s,i),'ROLL '+c.atk,'#f0c95c');vfx(slotEl(s,i),'spark');log(`UNCLE DICE ROLLED ${c.atk}`);await sleep(700)}
    if(c.id==='ratking'){let n=0;for(let j=0;j<3;j++)if(!S.board[s][j]){S.board[s][j]=mk('rat',s);S.board[s][j].hidden=false;n++}
      if(n){render();log(`RAT KING CALLS ${n} RAT${n>1?'S':''}`);for(let j=0;j<3;j++){const x=S.board[s][j];if(x&&x.id==='rat'&&x.fresh)fx(cardOf(s,j),'flip')}await sleep(700)}}
  }
  for(const s of[0,1])for(const c of S.board[s])if(c){c.fresh=false;c.hidden=false}
  render();
  if(S.arena===2&&Math.random()<.5){const occ=[];for(const s of[0,1])for(let i=0;i<3;i++)if(S.board[s][i])occ.push([s,i]);
    if(occ.length){const[s,i]=occ[rnd(occ.length)],c=S.board[s][i];const b=$('bolt');b.classList.remove('now');void b.offsetWidth;b.classList.add('now');
      c.hp-=3;render();fx(cardOf(s,i),'hit');float(slotEl(s,i),'ZAP -3','#cfe0ff');vfx(slotEl(s,i),'spark');log('LIGHTNING STRIKES!');await sleep(700);await cleanup()}}
  for(let t=1;t<=3;t++){
    log(`FIGHT · TURN ${t}`);await sleep(350);
    const acted=await turn();
    if(S.hp[0]<=0||S.hp[1]<=0||!acted)break;
  }
  await sleep(300);
  S.round++;
  if(S.hp[0]<=0||S.hp[1]<=0||S.round>ROUNDS)return end();
  startRound();
}
async function cast(c,s){
  const who=s?'DEALER':'YOU',o=1-s;
  if(c.id==='smell'){log(`${who} CAST BAD SMELL`);for(let j=0;j<3;j++)vfx(slotEl(o,j),'poison');await sleep(450);S.board[o]=shuffle(S.board[o]);render();for(let j=0;j<3;j++)if(S.board[o][j])fx(cardOf(o,j),'flip');await sleep(500);return}
  if(c.id==='coinflip'){log(`${who} FLIP A COIN`.replace('DEALER FLIP','DEALER FLIPS'));for(let j=0;j<3;j++){const x=S.board[s][j];if(!x||C[x.id].spell)continue;const h=Math.random()<.5;if(h)x.atk+=2;else x.hp-=1;render();float(slotEl(s,j),h?'HEADS +2':'TAILS -1',h?'#f0c95c':'#ff7a5c');vfx(slotEl(s,j),h?'coins':'spark');await sleep(380)}await cleanup();return}
  if(c.id==='rabbit'){const own=[0,1,2].filter(j=>S.board[s][j]&&!C[S.board[s][j].id].spell);log(`${who} RUB THE RABBIT'S FOOT`.replace('DEALER RUB','DEALER RUBS'));
    if(!own.length){float(slotEl(s,1),'NO ONE TO BLESS','#cfc');await sleep(500);return}
    const j=own[rnd(own.length)],x=S.board[s][j];if(Math.random()<.25){x.hp=0;float(slotEl(s,j),'CURSED!','#ff7a5c');vfx(slotEl(s,j),'boom')}else{x.atk+=2;x.hp+=2;render();float(slotEl(s,j),'+2 / +2','#a6d257');vfx(slotEl(s,j),'spark')}
    await sleep(650);await cleanup();return}
  if(c.id==='lastcall'){log(`${who} RANG LAST CALL`);for(const q of[0,1])for(let j=0;j<3;j++){const x=S.board[q][j];if(!x)continue;x.hp-=2;fx(cardOf(q,j),'hit');float(slotEl(q,j),'-2','#ff7a5c');vfx(slotEl(q,j),'boom')}
    render();await sleep(700);await cleanup();return}
  if(c.id==='blackhole'){
    log(`${s?'DEALER':'YOU'} CAST BLACK HOLE`);
    vfx(slotEl(0,1),'hole');vfx(slotEl(1,1),'hole');
    const victims=[[0,1],[1,1]].filter(([a,b])=>S.board[a][b]);
    victims.forEach(([a,b])=>{fx(cardOf(a,b),'die');float(slotEl(a,b),'GONE','#c9a6ff')});
    if(victims.some(([a])=>a===1))mood(3,1100);
    await sleep(700);victims.forEach(([a,b])=>S.board[a][b]=null);render();await sleep(250);
  }
}
async function turn(){
  let ticked=false;
  for(const s of[0,1])for(let i=0;i<3;i++){const c=S.board[s][i];if(c&&C[c.id].juke){const al=[0,1,2].filter(j=>j!==i&&S.board[s][j]&&!C[S.board[s][j].id].spell);if(al.length){const j=al[rnd(al.length)];S.board[s][j].atk+=1;float(slotEl(s,j),'+1 ATK','#f0c95c');vfx(slotEl(s,i),'honk');ticked=true}}}
  for(const s of[0,1])for(let i=0;i<3;i++){const c=S.board[s][i];if(c&&c.poison>0){c.hp-=c.poison;float(slotEl(s,i),'-'+c.poison,'#a6d257');vfx(slotEl(s,i),'poison');c.poison--;ticked=true}}
  if(ticked){render();await sleep(500);await cleanup()}
  const a=await attackPhase(true);
  if(S.hp[0]<=0||S.hp[1]<=0)return true;
  const b=await attackPhase(false);
  return a||b;
}
const guarded=(t)=>{const s=t.side,i=S.board[s].indexOf(t);return[i-1,i+1].some(j=>j>=0&&j<3&&S.board[s][j]&&C[S.board[s][j].id].guard&&S.board[s][j].hp>0)};
async function attackPhase(fast){
  const hits=[],attackers=[];
  for(const s of[0,1])for(let i=0;i<3;i++){
    const c=S.board[s][i];if(!c||c.atk<=0||c.hp<=0)continue;const d=C[c.id],o=1-s;
    if(!!d.fast!==fast)continue;
    if(c.stuck>0){c.stuck--;float(slotEl(s,i),'STUCK','#f59ad3');continue}
    attackers.push([s,i]);
    const targets=d.splash?[0,1,2].filter(j=>S.board[o][j]):(S.board[o][i]?[i]:[]);
    for(let k=0;k<(d.multi||1);k++){
      if(!targets.length)hits.push({c,s,face:true,dmg:c.atk});
      else targets.forEach(j=>hits.push({c,s,t:S.board[o][j],dmg:c.atk}));
    }
    if(d.scream)[i-1,i+1].forEach(j=>{if(j>=0&&j<3&&S.board[s][j])hits.push({c,s,t:S.board[s][j],dmg:1,friend:true})});
  }
  render();
  if(!hits.length)return false;
  if(fast)log('FAST! THE MAFIOSO SHOOTS FIRST');
  attackers.forEach(([s,i])=>fx(cardOf(s,i),'lunge'+s));
  await sleep(200);
  const dmgOn=new Map(),faceDmg=[0,0],stuckOn=new Set(),heal=[0,0],chomp=[];
  for(const h of hits){
    const d=C[h.c.id],o=1-h.s;
    if(h.face){S.hp[o]-=h.dmg;faceDmg[o]+=h.dmg;if(d.thief)S.bonus[h.s]++;if(d.drain)heal[h.s]+=h.dmg;continue}
    if(h.t.hp<=0&&!h.friend)continue;
    const before=h.t.hp;
    const arm=(C[h.t.id].armor||0)+(guarded(h.t)?1:0),dealt=Math.max(0,h.dmg-arm);
    h.t.hp-=dealt;dmgOn.set(h.t,(dmgOn.get(h.t)||0)+dealt);
    if(h.friend)continue;
    if(d.poison)h.t.poison=Math.max(h.t.poison,d.poison+(S.arena===1?1:0));
    if(d.stick&&dealt>0){h.t.stuck=1;stuckOn.add(h.t)}
    if(d.thief&&dealt>0)S.bonus[h.s]++;
    if(d.drain&&dealt>0)heal[h.s]+=dealt;
    if(d.eat&&before>0&&h.t.hp<=0){const g=Math.ceil((C[h.t.id].hp||2)/2);h.c.hp+=g;chomp.push([h.c,g])}
  }
  for(const s of[0,1])if(heal[s]){S.hp[s]=Math.min(START_HP,S.hp[s]+heal[s]);float(s?$('ehp'):$('php'),'+'+heal[s],'#a6d257')}
  render();
  for(const[t,v]of dmgOn){const s=t.side,i=S.board[s].indexOf(t);if(i<0)continue;const el=slotEl(s,i);
    fx(cardOf(s,i),'hit');float(el,v>0?'-'+v:'BLOCK',v>0?'#ff7a5c':'#9cc9ff');vfx(el,stuckOn.has(t)?'gum':(v>=4?'boom':'spark'))}
  for(const[c,g]of chomp){const i=S.board[c.side].indexOf(c);if(i>=0)setTimeout(()=>float(slotEl(c.side,i),'CHOMP +'+g,'#a6d257'),350)}
  if(faceDmg[1]){fx($('ehp'),'shake');float($('ehp'),'-'+faceDmg[1],'#ff7a5c');vfx($('ehp'),'spark');mood(2,900)}
  if(faceDmg[0]){fx($('php'),'shake');float($('php'),'-'+faceDmg[0],'#ff7a5c');mood(1,900)}
  await sleep(650);
  await cleanup();
  return true;
}
async function cleanup(){
  let any=false;const honk=[],bombs=[];
  for(const s of[0,1])for(let i=0;i<3;i++){const c=S.board[s][i];if(!c||c.hp>0)continue;
    const d=C[c.id];
    if(d.revive&&!c.revived){c.revived=true;c.hp=1;c.poison=0;any=true;float(slotEl(s,i),'SHE\'S BACK','#e6d6b0');continue}
    any=true;fx(cardOf(s,i),'die');vfx(slotEl(s,i),'shatter');
    if(c.id==='clown')honk.push(s);
    if(d.bomb)bombs.push([1-s,i,d.bomb]);
    if(d.payout){S.bonus[s]+=3;float(s?$('ehp'):$('php'),'+3 COINS','#f0c95c')}
    if(s===1)mood(3,800)}
  if(!any)return false;
  await sleep(480);
  for(const s of[0,1])for(let i=0;i<3;i++){const c=S.board[s][i];if(c&&c.hp<=0)S.board[s][i]=null}
  render();
  if(bombs.length){log('BOOM! THE BELLHOP BLEW UP');for(const[s,i,dm]of bombs){vfx(slotEl(s,i),'boom');const t=S.board[s][i];if(t){t.hp-=dm;fx(cardOf(s,i),'hit');float(slotEl(s,i),'-'+dm,'#ff7a5c')}}
    render();await sleep(600);await cleanup()}
  for(const s of honk){const o=1-s;S.board[o]=shuffle(S.board[o]);log('HONK! CARDS SWAPPED')}
  render();
  if(honk.length){for(const s of honk){for(let j=0;j<3;j++){vfx(slotEl(1-s,j),'honk');if(S.board[1-s][j])fx(cardOf(1-s,j),'flip')}}await sleep(550)}
  return true;
}
function end(){
  S.phase='end';render();
  const[a,b]=S.hp.map(v=>Math.max(0,v)),win=a>b,draw=a===b;
  const sc=$('endScreen');sc.className='screen '+(win?'win':'lose');
  $('endT').textContent=draw?'DRAW':win?'YOU WIN':'BUSTED';
  $('endT').style.color=draw?'var(--paper)':win?'var(--bulb)':'var(--blood)';
  const tr=win?30:draw?0:-15,g=win?25+rnd(16):draw?10:5;P.trophies=Math.max(0,P.trophies+tr);P.gold+=g;
  const nb=arenaOf(P.trophies);let un='';if(nb>P.best){P.best=nb;P.sel=nb;un=` NEW ARENA UNLOCKED: ${ARENAS[nb].n}! New cards are in your collection.`}
  let cm='';if(win){const e=P.cases.findIndex(c=>!c);if(e>=0){const r=Math.random(),k=r<.55?0:r<.85?1:r<.97?2:3;P.cases[e]={k,at:null};cm=` You won a ${CASES[k].n}!`}else cm=' Your case slots are full.'}
  addXP(win?20:draw?10:5);saveP();
  $('endD').textContent=`You ${a} HP · ${ARENAS[S.arena].who} ${b} HP. ${tr>0?'+':''}${tr} trophies, +${g} gold.`+cm+un;
  if(win){SND.duck(0,.4);SND.sting('win')}else SND.duck(.18,1.2);
  mood(win?3:1);sc.hidden=false;
}

/* ---------- pause ---------- */
const inMatch=()=>S&&$('menu').hidden&&$('endScreen').hidden&&S.phase!=='end'&&S.phase!=='idle'&&!S.dead;
function pauseGame(){if(!inMatch()||PAUSED)return;PAUSED=true;document.getAnimations().forEach(a=>{try{a.pause()}catch(_){}});SND.duck(.15,.3);drawPause();$('pauseScr').hidden=false}
function resumeGame(){if(!PAUSED)return;$('pauseScr').hidden=true;PAUSED=false;document.getAnimations().forEach(a=>{try{if(a.playState==='paused')a.play()}catch(_){}});SND.duck(.6,.5)}
function drawPause(){
  $('pauseBox').innerHTML=`<h3>PAUSED</h3><p style="text-align:center">Round ${Math.min(S.round,ROUNDS)} of ${ROUNDS} · ${ARENAS[S.arena||0].who} is waiting.</p>
   <div class="pbtns"><button class="b y" id="pRes" type="button">RESUME</button><button class="b ${SND.isOn()?'g':'p'}" id="pSnd" type="button">SOUND: ${SND.isOn()?'ON':'OFF'}</button><button class="b r" id="pQuit" type="button">QUIT MATCH</button></div>`;
  $('pRes').onclick=resumeGame;
  $('pSnd').onclick=()=>{SND.toggle();if(SND.isOn())SND.duck(.15,.1);drawPause()};
  $('pQuit').onclick=()=>{$('pauseBox').innerHTML=`<h3>QUIT MATCH?</h3><p style="text-align:center">Walking away counts as a loss. You lose 15 trophies.</p>
     <div class="pbtns"><button class="b r" id="qY" type="button">QUIT</button><button class="b y" id="qN" type="button">KEEP PLAYING</button></div>`;
    $('qN').onclick=drawPause;$('qY').onclick=quitMatch};
}
function quitMatch(){
  S.dead=true;PAUSED=false;$('pauseScr').hidden=true;
  document.getAnimations().forEach(a=>{try{a.cancel()}catch(_){}});
  document.querySelectorAll('.fly,.flt,.vfx,.dust').forEach(e=>e.remove());$('croupier').hidden=true;
  P.trophies=Math.max(0,P.trophies-15);addXP(2);saveP();
  S.phase='idle';openMenu(2);setTimeout(()=>toast('YOU WALKED AWAY · -15 TROPHIES'),200);
}
$('pauseB').onclick=e=>{e.stopPropagation();pauseGame()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});

applyArena(P.sel);openMenu(2);
S={arena:P.sel,round:1,hp:[START_HP,START_HP],coins:[3,3],bonus:[0,0],board:[[null,null,null],[null,null,null]],pile:[[],[]],hand:[],sel:null,phase:'idle'};
render();
</script>
