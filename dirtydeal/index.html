<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<title>Dirty Deal</title>
<style>@font-face{font-family:'Silkscreen';font-weight:400;font-display:swap;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Silkscreen';font-weight:700;font-display:swap;src:url(fonts/silkscreen-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'VT323';font-weight:400;font-display:swap;src:url(fonts/vt323-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:400;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;src:url(fonts/pixelify-sans-cyrillic-400-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:700;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;src:url(fonts/pixelify-sans-cyrillic-700-normal.woff2) format('woff2')}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior:none;position:fixed;inset:0;-webkit-touch-callout:none}
</style>
<style>
/* Layout: a fixed 9:16 game stage scaled to the screen; every element is placed in % over the painted arena. Single dark look by design. */
:root{
  --ink:#070605; --paper:#e6d6b0; --muted:#9a8a6c; --bulb:#f0c95c; --blood:#d23a2a; --atk:#ff7a5c; --hp:#9cc9ff; --psn:#a6d257; --gum:#f59ad3;
  --display:'Silkscreen','Pixelify Sans','Courier New',monospace; --body:'VT323','Pixelify Sans','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
img{image-rendering:pixelated;-webkit-user-drag:none;pointer-events:none}
.wrap{height:100%;display:grid;place-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:relative;height:100%;max-height:calc((100vw - 32px)*1376/768);aspect-ratio:768/1376;max-width:100%;container-type:size;overflow:hidden;
  background:#0d0b09;image-rendering:pixelated;--tilt:38deg;--r1w:18%;--r1t:35%;--r1a:20.8%;--r1b:41%;--r1c:61.2%;--r0w:21.5%;--r0t:47.5%;--r0a:13.9%;--r0b:39.25%;--r0c:64.6%}
#bg{position:absolute;z-index:0;left:0;width:100%;top:0;height:100%;background:url(assets/table.jpg) center/100% 100% no-repeat}
#bg::after{content:"";position:absolute;left:0;right:0;top:100%;height:12%;background:linear-gradient(#0d0b09,#0d0b09)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%)}
.abs{position:absolute}
button{font-family:var(--display);cursor:pointer;background:none;border:0;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}

/* top */
.bar{position:absolute;height:2.5cqh;background:url(assets/u_bar_e.png) center/100% 100% no-repeat}
.bar i{position:absolute;left:5.5%;top:26%;bottom:26%;background:var(--blood);transition:width .3s steps(5);
  background-image:repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px)}
.bar.me i{background-color:#6ea83c}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.6cqw;color:#fff;text-shadow:1px 1px 0 #000}
#ehp{right:4%;top:2%;width:40%}
#eicon{right:45%;top:1.4%;width:6.5%}
#round{left:4%;top:1.4%;font-family:var(--display);font-weight:700;font-size:4cqw;color:var(--bulb);text-shadow:2px 2px 0 #000;text-align:left;line-height:1.1}
#round small{display:block;font-size:2.4cqw;color:var(--muted);font-weight:400;text-shadow:1px 1px 0 #000,0 0 4px #000,0 0 4px #000}
#dealerWrap{left:50%;top:12.6%;height:23.8%;translate:-50% 0;z-index:1}
#dealer{display:block;height:100%;transition:transform .2s steps(3)}
#dealer.bump{transform:translateY(-3%)}
#info{display:none!important;opacity:0;pointer-events:none;transition:opacity .25s;left:4%;top:5.6%;width:92%;height:8.6%;background:rgba(8,6,5,.78);border:2px solid #000;box-shadow:0 0 0 1px rgba(230,214,176,.25);
  padding:1.2cqw 2cqw;font-size:3.4cqw;line-height:1;overflow:hidden;z-index:2}
#logline{display:none;font-family:var(--display);font-size:2.5cqw;letter-spacing:.06em;color:var(--bulb);font-weight:700;margin-bottom:.8cqw;text-shadow:0 0 6px rgba(240,201,92,.45)}
#info strong{color:var(--paper);font-weight:400;font-family:var(--display);font-size:2.4cqw;letter-spacing:.04em;display:block}
#info em{font-style:normal;color:var(--muted)}

.snd{position:absolute;z-index:7;width:8.4cqw;height:8.4cqw;display:grid;place-items:center;background:rgba(8,6,5,.7);border:2px solid #000;box-shadow:0 0 0 1px rgba(240,201,92,.35)}
.snd svg{width:70%;height:70%}
.snd .x{display:none}.snd.off .x{display:inline}.snd.off .w{display:none}
#pauseB{left:38.6%;top:1.1%;width:7cqw;height:7cqw}
#pauseB .x{display:none!important}
#pauseScr{z-index:55;background:rgba(5,4,3,.82);display:grid;place-items:center;padding:0 8%}
#pauseScr .box{animation:popin .25s cubic-bezier(.2,1.4,.4,1)}
#pauseScr .pbtns{display:flex;flex-direction:column;gap:3cqw;align-items:stretch;margin-top:3cqw}
#pauseScr .b{justify-content:center;font-size:4cqw;padding:3cqw}
#amb{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#amb>*{position:absolute;pointer-events:none}
.orb{width:0;height:0}.orb i{position:absolute;left:0;top:0;width:3px;height:2px;background:#0c0906;box-shadow:-2px -1px 0 0 rgba(200,210,220,.35),2px -1px 0 0 rgba(200,210,220,.35);animation:orbit var(--d) linear infinite;--r:16px}
@keyframes orbit{from{transform:rotate(0) translateX(var(--r)) translateY(0)}25%{transform:rotate(90deg) translateX(calc(var(--r)*.7)) translateY(3px)}50%{transform:rotate(180deg) translateX(var(--r)) translateY(-2px)}75%{transform:rotate(270deg) translateX(calc(var(--r)*1.2)) translateY(2px)}to{transform:rotate(360deg) translateX(var(--r)) translateY(0)}}
.spr{background-repeat:no-repeat;background-size:400% 100%;image-rendering:pixelated;animation:frames var(--fd,.36s) steps(4) infinite}
@keyframes frames{from{background-position:0 0}to{background-position:133.333% 0}}
.dropw{width:.7%;height:.9%;background:linear-gradient(rgba(200,220,210,.1),rgba(190,215,200,.8));border-radius:40%}
.rip{width:6%;height:1.4%;border:1px solid rgba(190,210,200,.55);border-radius:50%;translate:-50% -50%}
.splash{width:2.4%;height:.6%;border:1px solid rgba(200,215,235,.6);border-radius:50%;translate:-50% -50%}
.mote{width:2px;height:2px;background:rgba(255,230,170,.75);border-radius:50%}
.lamp{width:15%;height:31%;transform-origin:50% 0;animation:lampsw 3.8s ease-in-out infinite alternate;z-index:1}
.lamp img{width:100%;height:100%;object-fit:contain;object-position:50% 0;image-rendering:pixelated;display:block}
.lamp i{position:absolute;left:50%;top:80%;width:520%;aspect-ratio:1;translate:-50% -50%;background:radial-gradient(circle,rgba(255,220,140,.5),rgba(255,190,100,.14) 30%,transparent 62%);mix-blend-mode:screen;animation:bulb 5.3s infinite steps(1)}
@keyframes lampsw{from{rotate:-7deg}to{rotate:6deg}}
.tube{width:42%;height:7%;translate:-50% -50%;background:radial-gradient(ellipse,rgba(220,255,235,.6),rgba(180,240,210,.2) 40%,transparent 70%);mix-blend-mode:screen;animation:tube 4.3s infinite steps(1)}
@keyframes tube{0%{opacity:1}12%{opacity:.4}13%{opacity:1}41%{opacity:.15}42%{opacity:.9}43%{opacity:.1}45%{opacity:1}77%{opacity:.6}78%{opacity:1}}
.shade{width:14%;height:20%;translate:-50% -50%;background:radial-gradient(ellipse,rgba(0,0,0,.75),transparent 65%);animation:shade 7s ease-in-out infinite}
@keyframes shade{0%,100%{transform:translate(0,0);opacity:.4}30%{transform:translate(-8%,4%);opacity:.9}60%{transform:translate(6%,-3%);opacity:.6}}
.ecg{width:8.4%;height:3.9%;overflow:hidden;background:#06180d;box-shadow:inset 0 0 3px #000;border-radius:1px}
.ecg svg{width:200%;height:100%;display:block;animation:ecg 1.6s linear infinite;filter:drop-shadow(0 0 1.5px #7dff9a)}
.ecg b{position:absolute;right:4%;bottom:2%;font:700 1.5cqw var(--display);color:#ff5a4a;animation:bulb 1.6s infinite steps(1)}
@keyframes ecg{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.winrain{width:20%;height:17.8%;opacity:.45;background:repeating-linear-gradient(100deg,transparent 0 7px,rgba(190,210,235,.4) 7px 8px,transparent 8px 19px);background-size:100% 40px;animation:rain .4s linear infinite}
.winflash{width:20%;height:17.8%;background:rgba(220,230,255,.85);mix-blend-mode:screen;opacity:0;animation:bolt 11s infinite steps(1)}
.dropw.blood{background:linear-gradient(rgba(120,10,8,.2),rgba(150,18,12,.95));width:.6%}
.coldl{width:46%;aspect-ratio:1.4;translate:-50% -50%;background:radial-gradient(ellipse,rgba(210,235,255,.42),rgba(170,200,230,.12) 40%,transparent 70%);mix-blend-mode:screen;animation:tube 6.1s infinite steps(1)}
.fog{width:130%;height:6%;translate:-50% -50%;background:radial-gradient(ellipse at 30% 50%,rgba(210,225,235,.22),transparent 60%),radial-gradient(ellipse at 75% 60%,rgba(210,225,235,.18),transparent 55%);animation:fog 14s ease-in-out infinite alternate}
.fog.f2{animation-duration:19s;animation-direction:alternate-reverse;opacity:.7}
@keyframes fog{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.cbulb{width:7%;aspect-ratio:1;translate:-50% -50%;background:radial-gradient(circle,var(--c) 0 8%,color-mix(in srgb,var(--c) 35%,transparent) 20%,transparent 60%);mix-blend-mode:screen;animation:candle 1.6s infinite steps(1)}
.cbulb.dead{animation-name:deadb}
@keyframes deadb{0%,100%{opacity:0}46%{opacity:.9}49%{opacity:0}74%{opacity:.6}76%{opacity:0}}
.mouth{width:26%;height:16%;translate:-50% -50%;background:radial-gradient(ellipse,rgba(0,0,0,.9),transparent 70%);opacity:.3}
.glint{width:8%;height:24%;translate:-50% -50%;overflow:hidden}
.glint::after{content:"";position:absolute;left:-60%;top:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:glint 6s ease-in-out infinite}
.glint.g2::after{animation-delay:-3s}
@keyframes glint{0%,70%{left:-60%}85%{left:120%}100%{left:120%}}
.eyes{width:1.8%;height:.5%;display:flex;justify-content:space-between;animation:eyes 7s infinite steps(1)}
.eyes::before,.eyes::after{content:"";width:28%;height:100%;background:#ff3020;box-shadow:0 0 4px 1px rgba(255,40,20,.8)}
@keyframes eyes{0%{opacity:1}31%{opacity:0}33%{opacity:1}60%{opacity:1}61%{opacity:0}80%{opacity:0}81%{opacity:1}}
.eyes.e2{animation-duration:9.5s;animation-delay:-3s}
.neonA{width:9%;height:16%;translate:-50% -50%;background:radial-gradient(ellipse,rgba(255,40,60,.55),rgba(255,30,50,.18) 45%,transparent 70%);mix-blend-mode:screen;animation:neon 3.1s infinite steps(1)}
.candle{width:7%;aspect-ratio:1;translate:-50% -50%;background:radial-gradient(circle,rgba(255,190,90,.75),rgba(255,150,60,.2) 40%,transparent 70%);mix-blend-mode:screen;animation:candle 1.7s infinite steps(1)}
@keyframes candle{0%{opacity:1;scale:1}17%{opacity:.75;scale:.92}29%{opacity:1}47%{opacity:.55;scale:.85}53%{opacity:.95;scale:1.05}71%{opacity:.8}88%{opacity:1}}
.sway{animation:bulb 5.3s infinite steps(1),sway 3.6s ease-in-out infinite alternate!important}
@keyframes sway{from{margin-left:-1.6%}to{margin-left:1.6%}}
#dealer{transform-origin:50% 100%;animation:breath 4.2s ease-in-out infinite}
@keyframes breath{50%{scale:1.006 1.016}}
#lowhp{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .6s;box-shadow:inset 0 0 18cqw rgba(160,0,0,.75)}
.stage.low #lowhp{animation:lowp 1.1s ease-in-out infinite}
@keyframes lowp{0%,100%{opacity:.35}35%{opacity:1}}
.stage.low #glow{filter:brightness(.6)}
#hand{touch-action:none}
#cinfo{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:30;background:linear-gradient(transparent,rgba(5,4,3,.92) 14%,#0b0907);display:flex;flex-direction:column;justify-content:flex-end;padding:0 4% 3%;touch-action:none}
#cinfo .cib{display:flex;gap:4cqw;align-items:flex-end;background:#1a120c;border:3px solid #000;box-shadow:0 0 0 2px #6b5a3c,0 -10px 30px rgba(0,0,0,.6);padding:3cqw}
#cinfo .cic{width:38%;flex:none}#cinfo .cic .cd{height:auto;width:100%}
#cinfo .cit{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;gap:1.6cqw}
#cinfo .cit h4{margin:0;font-family:var(--display);font-weight:700;font-size:4.4cqw;color:var(--bulb);text-shadow:2px 2px 0 #000;line-height:1.05}
#cinfo .cit .rl{font-family:var(--display);font-size:2.6cqw;color:var(--muted)}
#cinfo .cit p{margin:0;font-size:4.4cqw;line-height:1.05;color:var(--paper)}
#cinfo .st2{display:flex;gap:2cqw;margin-top:auto}
#cinfo .st2 span{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:3.2cqw;padding:1.4cqw 0;background:#0e0a08;border:1px solid #000}
#cinfo .cih{text-align:center;font-family:var(--display);font-size:2.4cqw;color:var(--muted);margin-top:1.6cqw}
.hcard .swh{position:absolute;left:50%;top:-3.2cqw;translate:-50% 0;font-size:3cqw;color:var(--bulb);opacity:.6;animation:hop 1.4s ease-in-out infinite;pointer-events:none}
/* atmosphere */
#glow{left:22.1%;top:13.8%;width:120cqw;height:120cqw;translate:-50% -50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,226,140,.55) 0 2.5%,rgba(255,200,100,.22) 9%,rgba(255,180,80,.08) 30%,transparent 60%);animation:bulb 5.3s infinite steps(1)}
#flick{inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 22% 14%,rgba(0,0,0,.2),rgba(0,0,0,.55));opacity:0;animation:dim 5.3s infinite steps(1)}
@keyframes bulb{0%{opacity:1}31%{opacity:.75}32%{opacity:1}52%{opacity:.25}53%{opacity:.9}54%{opacity:.15}56%{opacity:1}78%{opacity:.6}79%{opacity:1}93%{opacity:.85}94%{opacity:1}}
@keyframes dim{0%{opacity:0}31%{opacity:.25}32%{opacity:0}52%{opacity:.75}53%{opacity:.1}54%{opacity:.9}56%{opacity:0}78%{opacity:.4}79%{opacity:0}93%{opacity:.15}94%{opacity:0}}
.smoke{position:absolute;width:0;height:0;pointer-events:none;z-index:1}
.smoke span{position:absolute;left:0;top:0;width:4.4cqw;height:4.4cqw;margin:-2.2cqw;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(215,208,190,.62),rgba(215,208,190,.2) 45%,transparent 70%);animation:puff var(--d) linear var(--dl) infinite}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.35)}12%{opacity:.85}55%{transform:translate(calc(var(--x) * .5),-6cqh) scale(1.6)}100%{opacity:0;transform:translate(var(--x),-13cqh) scale(3)}}

/* arena */
.slot{position:absolute;aspect-ratio:312/530;display:grid;place-items:center;cursor:pointer;transform:perspective(90cqw) rotateX(var(--tilt));transform-origin:50% 100%;transform-style:preserve-3d}
.slot::after{content:"";position:absolute;inset:2%;border:2px dashed rgba(230,214,176,.28);pointer-events:none}
.slot:has(.cd)::after{display:none}
.slot.open::before{content:"";position:absolute;inset:3%;border:2px solid rgba(240,201,92,.75);box-shadow:0 0 10px rgba(240,201,92,.5),inset 0 0 10px rgba(240,201,92,.35);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.45}}
.r1{width:var(--r1w);top:var(--r1t)}.r0{width:var(--r0w);top:var(--r0t)}
.r1.c0{left:var(--r1a)}.r1.c1{left:var(--r1b)}.r1.c2{left:var(--r1c)}
.r0.c0{left:var(--r0a)}.r0.c1{left:var(--r0b)}.r0.c2{left:var(--r0c)}
.stage:not(.a1) .smoke{display:none}
#rain,#bolt{position:absolute;inset:0;pointer-events:none;display:none}
.a3 #rain{display:none;z-index:3;opacity:.5;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(190,210,235,.35) 9px 10px,transparent 10px 23px);background-size:100% 46px;animation:rain .35s linear infinite}
@keyframes rain{to{background-position:-12px 46px}}
.a3 #bolt{display:block;z-index:4;background:rgba(200,255,225,.55);mix-blend-mode:screen;opacity:0;animation:bolt 9s infinite steps(1)}
@keyframes bolt{0%{opacity:0}61%{opacity:.55}62%{opacity:0}63%{opacity:.35}64%{opacity:0}}
#bolt.now{animation:boltnow .5s steps(1)}
@keyframes boltnow{0%{opacity:.9}20%{opacity:0}40%{opacity:.7}60%{opacity:0}}
.a2 #flick,.a4 #flick{animation-duration:4.1s}
.slot .cd{filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
#log{display:none;left:50%;top:75.2%;transform:translate(-50%,-50%);font-family:var(--display);font-size:3.2cqw;color:var(--bulb);background:rgba(8,6,5,.82);padding:.6cqw 2.4cqw;white-space:nowrap;text-shadow:0 0 6px rgba(240,201,92,.5);z-index:5;border:1px solid #000}

/* card */
.cd{position:relative;height:100%;aspect-ratio:312/530;container-type:inline-size}
.hcard .cd,.dc .cd{height:auto;width:100%}
.cd>img{position:absolute}
.cd .fr{inset:0;width:100%;height:100%}
.cd .art{left:2%;top:3%;width:96%;height:60%;object-fit:contain;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.6))}
.cd .back{inset:0;width:100%;height:100%}
.cd span{position:absolute;display:grid;place-items:center;text-align:center;line-height:1}
.cost{z-index:2;left:3.5%;top:2.4%;width:19%;aspect-ratio:1;font-family:var(--display);font-weight:700;font-size:15cqw;color:var(--bulb);text-shadow:2px 2px 0 #000}
.nm{left:5%;right:5%;top:62%;height:19%;font-size:18cqw;color:#f3e6c4;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.cd.spell .nm{color:#e9dcff;top:60%}
.cd.token .nm{color:#fff}
.st{top:83.5%;width:18%;height:12.6%;font-family:var(--display);font-weight:700;font-size:15cqw;text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.atk{left:6%;color:var(--atk)}.hpv{right:6%;color:var(--hp)}
.cd .chips{position:absolute;right:4%;top:10%;display:flex;flex-direction:column;gap:2cqw;align-items:flex-end;z-index:2}
.chip{display:flex;align-items:center;font-family:var(--display);font-size:11cqw;color:#fff;text-shadow:1px 1px 0 #000}
.chip img{position:static;width:22cqw;height:auto}

/* bottom */
#php{left:3%;top:70%;width:40%}
#coins{left:45%;top:69.3%;display:flex;align-items:center;gap:1.5cqw;font-family:var(--display);font-weight:700;font-size:5cqw;color:var(--bulb);text-shadow:2px 2px 0 #000}
#coins img{width:6.5cqw}
#hand{left:3%;top:76.8%;width:94%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.1%;z-index:3}
.hcard{transition:transform .12s;cursor:pointer}
.hcard.sel{transform:translateY(-8%) scale(1.04)}
.hcard.sel .cd{filter:drop-shadow(0 0 4px var(--bulb)) drop-shadow(0 0 2px var(--bulb))}
.hcard.poor .cd{filter:grayscale(.85) brightness(.5)}
.hcard.used{visibility:hidden}
#fight{right:3%;top:68.2%;width:30%;z-index:4}
#fight img{width:100%}
#fight:not(:disabled):active{transform:translateY(3%)}
#fight:disabled{cursor:default}

/* flying cards + croupier hand */

.fly .cd{height:auto;width:100%}
.f3{position:relative;transform-style:preserve-3d}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fr1{position:absolute;inset:0;transform:rotateY(180deg)}
.fshadow{position:absolute;inset:6% 4% -2% 4%;background:rgba(0,0,0,.55);filter:blur(5px);z-index:-1;border-radius:6%}
.dust{position:absolute;left:50%;bottom:-12%;width:190%;aspect-ratio:80/60;translate:-50% 0;pointer-events:none;z-index:6;
  background:url(assets/v_dust.png) 0 0/600% 100% no-repeat;image-rendering:pixelated;animation:dust .5s steps(5,jump-none) forwards}

#croupier{left:0;top:0;width:106%;max-width:none;z-index:22;pointer-events:none;filter:drop-shadow(-4px 8px 0 rgba(0,0,0,.45));will-change:transform}

/* fx */

@keyframes l0{50%{transform:translateY(-18%)}}@keyframes l1{50%{transform:translateY(18%)}}
.hit{animation:hit .35s steps(5)}
@keyframes hit{20%{transform:translateX(-6%);filter:brightness(2.2) sepia(1) hue-rotate(-40deg)}60%{transform:translateX(6%)}}
.flip{animation:flip .3s steps(4)}
.land{animation:land .25s ease-out}@keyframes land{0%{transform:translateY(-8%) scale(1.06)}100%{transform:none}}@keyframes flip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.die{animation:die .45s steps(5) forwards}@keyframes die{to{transform:scale(.2) rotate(40deg);opacity:0}}
.flt{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:6.2cqw;pointer-events:none;z-index:30;white-space:nowrap;

@keyframes flt{to{transform:translate(-50%,-170%);opacity:0}}
.vfx{position:absolute;left:50%;top:50%;width:150%;transform:translate(-50%,-50%) scale(.5);mix-blend-mode:screen;z-index:25;animation:vfx .6s steps(6) forwards}
@keyframes vfx{60%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
.shake{animation:hit .35s steps(5)}

.dt.on{background:var(--bulb);color:#1a1000}
#deckRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.4cqh 4%;padding:2.6cqw 3cqw 3.4cqw;background:rgba(8,6,5,.78);border:2px solid #000}
#deckRow.swap{box-shadow:0 0 0 2px var(--bulb),0 0 14px rgba(240,201,92,.6)}
#deckRow.swap .mc{animation:wig .35s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
#avg{font-size:3.8cqw;text-shadow:1px 1px 0 #000}
#coll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.6cqh 4%;padding:0 3cqw}
.mc{position:relative;cursor:pointer;min-width:0}
.mc .cd,.cw .cd,.loot .cd,.bigc .cd{height:auto;width:100%}
.mc.lock{cursor:default}.mc.lock .cd{filter:grayscale(1) brightness(.35)}
.mbar{height:3.2cqw;margin-top:1cqw;background:#000;border:1px solid #6b5a3c;position:relative;font-family:var(--display);font-size:2.4cqw;color:#fff;display:grid;place-items:center;text-shadow:1px 1px 0 #000}
.mbar i{position:absolute;inset:0 auto 0 0;background:#3e7bb8}.mbar.full i{background:#5fae3c}
.mbar b{position:relative;font-weight:400}
.mbar.full::after{content:"▲";position:absolute;left:-1.5cqw;top:50%;translate:0 -50%;color:#7fe04b;font-size:2.6cqw;animation:hop .7s infinite}
.cd .lv{left:27%;right:27%;top:84.5%;height:11%;font-family:var(--display);font-weight:700;font-size:10cqw;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
#pEvents{background:#0d0b09 url(assets/r_table.jpg) center/100% 100% no-repeat!important}
#pEvents::before{background:linear-gradient(rgba(0,0,0,.35),transparent 14%,transparent 84%,rgba(0,0,0,.5))!important}
.rglow{position:absolute;left:50%;top:26%;width:120%;aspect-ratio:1;translate:-50% -50%;pointer-events:none;z-index:1;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,226,140,.22),rgba(255,200,100,.08) 35%,transparent 60%);animation:bulb 5.3s infinite steps(1)}
.rdim{position:absolute;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at 50% 5%,rgba(0,0,0,.15),rgba(0,0,0,.55));opacity:0;animation:dim 5.3s infinite steps(1)}
.stage:not(.a1) .smoke.rsm{display:block}
.rwrap{position:absolute;left:21%;top:13.2%;width:58%;aspect-ratio:1;z-index:2;filter:drop-shadow(0 10px 10px rgba(0,0,0,.75))}
.rwrap canvas,.rwrap .rrim{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#rRes{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:3;min-width:15cqw;padding:1.2cqw 2.4cqw;font-family:var(--display);font-weight:700;font-size:7cqw;color:#e6d6b0;border:3px solid #000;text-shadow:2px 2px 0 #000;text-align:center;animation:popin .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 2px #6b5a3c}
#rChips{position:absolute;left:8.6%;top:52%;width:10.6%;display:flex;flex-direction:column;gap:2.2cqw;z-index:4}
.chp{position:relative;width:100%;aspect-ratio:1;background:center/100% 100% no-repeat;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:2.8cqw;color:#e6d6b0;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;image-rendering:pixelated;filter:drop-shadow(1px 3px 0 rgba(0,0,0,.6));transition:transform .12s}
.chp.on{transform:translate(18%,-6%) scale(1.15);filter:drop-shadow(0 0 4px var(--bulb)) drop-shadow(1px 3px 0 rgba(0,0,0,.6))}
#rHist{position:absolute;right:8.4%;top:52%;width:9%;display:flex;flex-direction:column;gap:1cqw;z-index:4}
#rHist span{width:100%;aspect-ratio:1;display:grid;place-items:center;font-family:var(--display);font-size:2.6cqw;color:#e6d6b0;border:1px solid #000;text-shadow:1px 1px 0 #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#rHist span:first-child{outline:2px solid var(--bulb)}
.rbar{position:absolute;left:8.6%;right:8.4%;top:45.9%;height:4.4%;display:flex;align-items:center;gap:2cqw;z-index:4}
#rInfo{flex:1;min-width:0;font-family:var(--display);font-size:2.4cqw;color:#e6d6b0;text-align:center;line-height:1.2;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
#rInfo b{color:var(--bulb)}#rInfo .fr{color:#9fd067}
#rClear{font-size:2.6cqw;padding:1.8cqw 2cqw;flex:none}
#rSpin{flex:none;font-size:3cqw;padding:1.8cqw 2.4cqw;white-space:nowrap}
#rBoard{position:absolute;left:20.6%;top:52.2%;width:58.8%;height:32%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:.8cqw;z-index:3}
.rc{position:relative;border:1px solid rgba(0,0,0,.7);font-family:var(--display);font-weight:700;font-size:3cqw;color:#d9c9a0;text-shadow:1px 1px 0 #000;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -3px 0 rgba(0,0,0,.35);background-blend-mode:multiply}
.rc.rd{background-color:rgba(118,30,22,.86)}.rc.bk{background-color:rgba(16,14,12,.86)}.rc.gr{background-color:rgba(36,82,40,.9);grid-column:1/-1}
.rc.wide{grid-column:span 3;font-size:2.8cqw}
.rc.hit{outline:3px solid var(--bulb);outline-offset:-1px;z-index:1;animation:hop .5s ease-in-out 3}
.rc i{position:absolute;right:-1.4cqw;top:-1.8cqw;width:6.4cqw;height:6.4cqw;background:center/100% 100% no-repeat;image-rendering:pixelated;font-style:normal;font-size:2.2cqw;color:#e6d6b0;display:grid;place-items:center;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;z-index:2;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.6))}
#rRoach{position:absolute;left:0;top:0;width:7%;z-index:5;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.5))}
#rHand{position:absolute;left:0;top:0;width:106%;max-width:none;z-index:7;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(-4px 8px 0 rgba(0,0,0,.45))}
.panel{position:absolute;left:5%;right:5%;z-index:2;background:rgba(8,6,5,.86);border:2px solid #000;box-shadow:0 0 0 1px rgba(240,201,92,.3);padding:3cqw;text-align:center}
.panel b{display:block;font-family:var(--display);font-weight:700;font-size:4.2cqw;color:var(--bulb);text-shadow:2px 2px 0 #000;margin-bottom:1.4cqw}
.panel p{margin:0;font-size:4cqw;line-height:1.05}
.panel .b{margin-top:2.4cqw}
.soonTag{display:inline-block;margin-top:2cqw;font-family:var(--display);font-size:2.6cqw;color:#000;background:var(--bulb);padding:.6cqw 1.6cqw}
.road{display:flex;flex-direction:column;gap:2cqw;max-height:62cqh;overflow-y:auto;overscroll-behavior:contain;padding-right:1cqw}
.ra{display:flex;gap:2.4cqw;align-items:center;background:#0e0a08;border:2px solid #000;box-shadow:inset 0 0 0 1px #3b2a1c;padding:1.6cqw}
.ra.cur{box-shadow:inset 0 0 0 2px var(--bulb)}.ra.lk{opacity:.55}
.ra .th{width:20%;aspect-ratio:3/4;flex:none;background:center 45%/cover no-repeat;border:1px solid #000;image-rendering:pixelated}
.ra .tx{flex:1;min-width:0;line-height:1.05}.ra .tx b{font-family:var(--display);font-size:3cqw;color:var(--bulb)}.ra .tx span{display:block;font-size:3.4cqw}
.ra .un{display:flex;gap:1cqw;margin-top:1cqw;flex-wrap:wrap}.ra .un img{width:8cqw;height:8cqw;object-fit:contain;background:#1c140d;border:1px solid #000;image-rendering:pixelated}
.inp{width:100%;font-family:var(--display);font-size:4.4cqw;padding:2cqw;background:#0e0a08;color:var(--paper);border:2px solid #6b5a3c;text-transform:uppercase}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:3cqw;padding:2cqw 0;border-bottom:1px solid #3b2a1c;font-family:var(--display);font-size:3.2cqw}
#spinBoxOld{position:absolute;left:4%;right:4%;top:62%;height:10.4%;display:flex;align-items:center;gap:3cqw;background:rgba(8,6,5,.82);border:2px solid #000;box-shadow:0 0 0 1px rgba(240,201,92,.3);padding:0 3cqw;z-index:2}
#spinBox>img{height:78%}
.sbt{flex:1;min-width:0;line-height:1.05}.sbt b{display:block;font-family:var(--display);font-weight:700;font-size:3.4cqw;color:var(--bulb)}.sbt span{font-size:3.6cqw}
#deals{position:absolute;left:3%;right:3%;top:64.6%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3%;z-index:2}
.deal{display:flex;flex-direction:column;align-items:center;gap:.8cqh;cursor:pointer;position:relative}
.deal .cw{width:82%;position:relative}
.deal .q{position:absolute;right:-6%;top:-4%;font-family:var(--display);font-weight:700;font-size:3.2cqw;color:#fff;background:var(--blood);border:2px solid #000;padding:0 1cqw;z-index:3}
.deal .caseimg{width:100%;aspect-ratio:312/530;display:grid;place-items:center}.deal .caseimg img{width:100%}
.price{width:100%;display:flex;align-items:center;justify-content:center;gap:1cqw;font-family:var(--display);font-weight:700;font-size:3cqw;color:#fff;text-shadow:1px 1px 0 #000;background:linear-gradient(#5fae3c,#3c7a24);border:2px solid #000;padding:.5cqh 0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.price img{width:4.4cqw}
.deal.sold{opacity:.4;cursor:default}.deal.sold .price{background:#3a2d22}
#pop{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:4%}
.box{position:relative;width:100%;background:#1a120c;border:3px solid #000;box-shadow:0 0 0 2px #6b5a3c,0 10px 30px rgba(0,0,0,.6);padding:4cqw;animation:popin .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.box h3{margin:0 0 2cqw;font-family:var(--display);font-weight:700;font-size:4.4cqw;color:var(--bulb);text-shadow:2px 2px 0 #000;text-align:center}
.box p{margin:0 0 2cqw;font-size:4.2cqw;line-height:1.05}
.box .x{position:absolute;right:-3cqw;top:-3cqw;width:10cqw}.box .x img{width:100%}
.prow{display:flex;gap:4cqw;align-items:flex-start}
.prow .bigc{width:40%;flex:none}
.prow .txt{flex:1;min-width:0}
.stat{display:flex;justify-content:space-between;font-family:var(--display);font-size:3cqw;padding:.8cqw 0;border-bottom:1px solid #3b2a1c}
.stat em{font-style:normal;color:#7fe04b}
.btns{display:flex;gap:3cqw;justify-content:center;margin-top:3cqw;flex-wrap:wrap}
.b{font-family:var(--display);font-weight:700;font-size:3.4cqw;padding:2cqw 3.4cqw;border:3px solid #000;color:#fff;text-shadow:2px 2px 0 #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.22);display:inline-flex;align-items:center;gap:1.2cqw}
.b img{width:4.6cqw}
.b.y{background:#f0b92c;color:#2a1d00;text-shadow:none}.b.g{background:#4f9a32}.b.r{background:#b8321f}.b.p{background:#7c4fb0}
.b:disabled{filter:grayscale(.85) brightness(.55);cursor:default}
.loot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3cqw;margin:3cqw 0}
.loot>div{position:relative;opacity:0;animation:lootin .45s cubic-bezier(.2,1.4,.4,1) forwards}
.loot .q{position:absolute;right:-4%;bottom:-4%;font-family:var(--display);font-weight:700;font-size:3.4cqw;color:#fff;background:#3c7a24;border:2px solid #000;padding:0 1cqw}
@keyframes lootin{from{opacity:0;transform:translateY(30%) scale(.5)}to{opacity:1;transform:none}}
.caseBig{display:block;width:52%;margin:0 auto 2cqw;animation:hop 1s ease-in-out infinite}
.wheelBox{position:relative;width:86%;margin:2cqw auto 3cqw}
.wheelWrap{transform:scaleY(.74);transform-origin:50% 50%}
.wheelSq{width:100%;aspect-ratio:1}
.wheelSq img{width:100%;height:100%}
.ptr{position:absolute;left:50%;top:-4%;width:16%;translate:-50% 0;rotate:90deg;z-index:2;filter:drop-shadow(2px 2px 0 #000)}
#toast{position:absolute;left:50%;top:22%;translate:-50% 0;z-index:30;font-family:var(--display);font-weight:700;font-size:3.4cqw;color:#1a1000;background:var(--bulb);border:3px solid #000;padding:1.6cqw 3cqw;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}

/* spin machine */
#slotm{position:absolute;left:79%;width:20%;bottom:53.2%;z-index:1;cursor:pointer;filter:drop-shadow(-3px 5px 0 rgba(0,0,0,.6))}
#slotm.ready .sm{animation:smglow 1.1s steps(2) infinite}
@keyframes smglow{0%{filter:brightness(1)}50%{filter:brightness(1.22) drop-shadow(0 0 4px rgba(240,201,92,.6))}}
#slotm.spent .sm{filter:brightness(.62) saturate(.6)}
.sm{position:relative;width:100%;aspect-ratio:52/82}
.sm>img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#slotm .sm{filter:brightness(.86)}
.sm .rw{position:absolute;top:21.95%;height:17.07%;width:15.38%;overflow:hidden;background:#d8ccaa}
.sm .rw img{position:absolute;left:0;top:0;width:100%;height:2857.14%;max-width:none;image-rendering:pixelated;will-change:transform}
.sm .rw::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.6),transparent 32%,transparent 68%,rgba(0,0,0,.6))}
.sm .pay{position:absolute;left:21.15%;right:28.85%;top:30.1%;height:1.2%;background:rgba(200,30,20,.5);pointer-events:none}
#smTag{position:absolute;left:38%;top:101%;translate:-50% 0;font:700 2.1cqw var(--display);color:var(--bulb);text-shadow:1px 1px 0 #000;white-space:nowrap;background:rgba(8,6,5,.78);padding:.3cqw 1.2cqw;border:1px solid #000;pointer-events:none}
#slotm.spent #smTag{color:var(--muted)}
#mods{left:4%;top:7.6%;display:flex;flex-direction:column;gap:.5cqw;font:700 2.2cqw var(--display);text-shadow:1px 1px 0 #000;pointer-events:none;z-index:2;max-width:52%}
#mods span{background:rgba(8,6,5,.72);padding:.3cqw 1cqw;border-left:2px solid var(--bulb);color:var(--bulb)}
#mods span.e{border-color:var(--blood);color:#ff8a6a}
#spinScr{position:absolute;inset:0;z-index:36;background:rgba(5,4,3,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqh;padding:0 6%}
#spinBig{width:44%}
#spinScr .sm{filter:drop-shadow(0 8px 0 rgba(0,0,0,.6))}
#spinRes{text-align:center;font-family:var(--display);min-height:24cqw;display:flex;flex-direction:column;align-items:center;gap:1.2cqw}
#spinRes small{font-size:2.8cqw;color:var(--muted);letter-spacing:.06em}
#spinRes b{font-size:7cqw;line-height:1;text-shadow:3px 3px 0 #000;animation:popin .3s cubic-bezier(.2,1.4,.4,1)}
#spinRes b.g{color:var(--bulb)}#spinRes b.n{color:#e6d6b0}#spinRes b.b{color:var(--blood)}
#spinRes p{font-size:3.6cqw;color:var(--paper);text-shadow:1px 1px 0 #000}
#spinRes em{font-style:normal;font-size:2.4cqw;color:#e8a07a}

/* voice, intro, hints, jobs */
#say{position:absolute;left:58%;top:10%;max-width:39%;z-index:9;background:radial-gradient(circle at 80% 20%,rgba(90,60,20,.25),transparent 30%),radial-gradient(circle at 15% 85%,rgba(120,20,10,.2),transparent 25%),#d9cba4;color:#1a0f08;font:400 4.1cqw/1 var(--body);padding:1.2cqw 2cqw 1.4cqw;border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .25s;min-height:5cqw}
#say::before{content:"";position:absolute;left:-2.6cqw;top:30%;border:1.3cqw solid transparent;border-right:1.4cqw solid #000}
#say.on{opacity:1}
#intro{position:absolute;inset:0;z-index:37;display:grid;place-items:center;background:rgba(0,0,0,.55);animation:fadein .25s}
#intro .ib{width:100%;padding:4cqw 6%;text-align:center;background:linear-gradient(90deg,transparent,rgba(10,6,4,.95) 12%,rgba(10,6,4,.95) 88%,transparent);border-block:2px solid #3b2a1c;display:flex;flex-direction:column;gap:1.4cqw;animation:slidein .45s cubic-bezier(.2,1.2,.4,1)}
#intro small{font:700 2.8cqw var(--display);color:var(--muted);letter-spacing:.1em}
#intro b{font:700 8cqw/1 var(--display);color:var(--bulb);text-shadow:3px 3px 0 #000,0 0 18px rgba(240,201,92,.35)}
#intro span{font:700 4cqw var(--display);color:var(--blood);text-shadow:2px 2px 0 #000}
#intro em{font-style:normal;font-size:4.2cqw;color:#e8a07a}
@keyframes fadein{from{opacity:0}}@keyframes slidein{from{transform:translateX(-30%) skewX(-8deg);opacity:0}}
#tip{position:absolute;z-index:26;pointer-events:none;background:var(--bulb);color:#1a1000;font:700 2.8cqw var(--display);padding:1.2cqw 2cqw;border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.6);white-space:nowrap;animation:tipbob .9s ease-in-out infinite}
#tip i{position:absolute;top:100%;translate:-50% -1px;font-style:normal;color:var(--bulb);font-size:3.4cqw;line-height:1;text-shadow:0 2px 0 #000}
@keyframes tipbob{50%{transform:translateY(-1.2cqw)}}
#jobBtn{position:absolute;left:2%;top:19.4%;width:38%;height:5.8%;display:flex;align-items:center;gap:2cqw;padding:0 2cqw;z-index:5;background:linear-gradient(#3a2a1a,#1a120a);border:2px solid #000;box-shadow:inset 0 0 0 2px #6b5a3c;text-align:left}
#jobBtn .ji{width:7cqw;height:7cqw;flex:none;background:#d9cba4;border:2px solid #000;display:grid;place-items:center;font:700 3.6cqw var(--display);color:var(--blood);transform:rotate(-6deg)}
#jobBtn span{line-height:1;min-width:0}#jobBtn b{display:block;font:700 2.8cqw var(--display);color:var(--bulb);white-space:nowrap}#jobBtn em{font-style:normal;font-size:3.6cqw;color:var(--paper)}
#jobBtn.ready{box-shadow:inset 0 0 0 2px var(--bulb),0 0 12px rgba(240,201,92,.55)}
.dot2{position:absolute;right:-1.4cqw;top:-1.4cqw;width:4.6cqw;height:4.6cqw;border-radius:50%;background:#d23a2a;border:2px solid #000;font:700 2.6cqw/1 var(--display);color:#fff;display:grid;place-items:center}
#prof .dot2{right:13%;top:6%}
.jobs{display:flex;flex-direction:column;gap:2cqw}
.job{display:flex;align-items:center;gap:2.4cqw;background:#0e0a08;border:2px solid #000;box-shadow:inset 0 0 0 1px #3b2a1c;padding:2cqw}
.job.got{opacity:.55}.job .jt{flex:1;min-width:0}.job .jt>b{font-size:4cqw;font-weight:400;line-height:1}
.job .b{min-width:20cqw;justify-content:center;gap:1cqw;font-size:3cqw;padding:1.6cqw 2cqw}.job .b img{width:4.4cqw}
.job .b:disabled{filter:grayscale(.7) brightness(.7)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;margin:3cqw 0}
.stats div{display:flex;justify-content:space-between;gap:1cqw;background:#0e0a08;border:1px solid #3b2a1c;padding:1.2cqw 1.6cqw;font-family:var(--display);font-size:2.3cqw;color:var(--muted)}
.stats b{color:var(--bulb);font-size:2.8cqw}
.rew{display:flex;gap:1.6cqw;margin-bottom:3cqw}
.rw{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1cqw;background:#0e0a08;border:2px solid #000;box-shadow:inset 0 0 0 1px #3b2a1c;padding:1.6cqw .6cqw;font-family:var(--display);font-size:2.4cqw;color:var(--muted)}
.rw .ic{height:9cqw;display:flex;align-items:center;gap:.6cqw;font-size:3.4cqw;color:var(--paper)}.rw .ic img{height:7cqw}
.rw.on{box-shadow:inset 0 0 0 2px var(--bulb),0 0 10px rgba(240,201,92,.4)}.rw.got{opacity:.4}

.nights{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw;margin:2cqw 0 3cqw}

  const dt=$('deckTabs');dt.innerHTML='';[0,1,2].forEach(i=>{const b=document.createElement('button');b.type='button';b.className='dt'+(i===P.di?' on':'');b.textContent=i+1;b.onclick=()=>{P.di=i;saveP();endSwap();renderMenu()};dt.appendChild(b)});
  const row=$('deckRow');row.innerHTML='';
  deckNow().forEach((id,k)=>{const el=document.createElement('div');el.className='mc';el.innerHTML=cardHTML(id,null,P.cards[id].l)+barHTML(id);
    el.onclick=()=>{if(swapId){deckNow()[k]=swapId;saveP();toast('DECK UPDATED');endSwap();renderMenu()}else cardPop(id,true)};row.appendChild(el)});
  $('avg').innerHTML=`Avg cost <b style="color:var(--bulb)">${avgCost()}</b> · tap a card to upgrade or swap`;
  const co=$('coll');co.innerHTML='';
  ownedIds().filter(id=>!deckNow().includes(id)).forEach(id=>{const el=document.createElement('div');el.className='mc';el.innerHTML=cardHTML(id,null,P.cards[id].l)+barHTML(id)+(P.seen.includes(id)?'':'<i class="newt">NEW</i>');el.onclick=()=>cardPop(id,false);co.appendChild(el)});
  ALL.filter(id=>!unlocked(id)).sort((x,y)=>C[x].u-C[y].u).forEach(id=>{const d=C[id],el=document.createElement('div');el.className='mc lock';
    el.innerHTML=`<div class="cd"><img class="fr" src="assets/f_${frameOf(id)}.png" alt=""><img class="art" src="assets/c_${id}.png" alt=""></div><div class="lockt"><img src="assets/u_lock.png" alt="">${d.n.toUpperCase()}<br>ARENA ${d.u+1}</div><div class="mbar"><b>${ARENAS[d.u].t} <span style="color:var(--bulb)">TROPHIES</span></b></div>`;
    el.onclick=()=>toast(`UNLOCKS IN ARENA ${d.u+1}: ${ARENAS[d.u].n}`);co.appendChild(el)});
  row.classList.toggle('swap',!!swapId);
}
function endSwap(){swapId=null;const r=$('deckRow');if(r)r.classList.remove('swap')}
function cardPop(id,inDeck){if(!P.seen.includes(id)){P.seen.push(id);saveP();setTimeout(renderCards,0)}
  const c=P.cards[id],d=C[id],u=UP[c.l],now=statsFor(id,c.l),nx=statsFor(id,c.l+1);
  const canUp=u&&c.n>=u.n&&P.gold>=u.g;
  const st=d.spell?'':`<div class="stat"><span>ATTACK</span><span>${d.dice?'1–6':d.slot?'1–9':now.atk}${u&&!d.dice&&nx.atk>now.atk?` <em>→ ${nx.atk}</em>`:''}</span></div><div class="stat"><span>SHIELD</span><span>${d.slot?'1–9':now.hp}${u&&!d.slot?` <em>→ ${nx.hp}</em>`:''}</span></div>`;
  pop(`<h3>${d.f.toUpperCase()}</h3><div class="prow"><div class="bigc">${cardHTML(id,null,c.l)}${barHTML(id)}</div><div class="txt"><p><span style="font-family:var(--display);font-size:2.8cqw;color:var(--muted)">${d.role.toUpperCase()} · COST ${d.cost} · LEVEL ${c.l}</span><br>${d.t}</p>${st}</div></div>
   <div class="btns">${u?`<button class="b g" id="pUp" type="button" ${canUp?'':'disabled'}>UPGRADE <img src="assets/u_coin.png" alt="">${u.g}</button>`:''}${inDeck?'':'<button class="b y" id="pUse" type="button">USE</button>'}</div>
   ${u&&c.n<u.n?`<p style="text-align:center;margin-top:2cqw;color:var(--muted)">Collect ${u.n-c.n} more from cases or the Black Market.</p>`:''}`);
  const b=$('pUp');if(b)b.onclick=()=>{if(!canUp)return;job('up');c.n-=u.n;P.gold-=u.g;c.l++;addXP(15*c.l);saveP();toast(`${d.n.toUpperCase()} LEVEL ${c.l}!`);renderMenu();cardPop(id,inDeck)};
  const us=$('pUse');if(us)us.onclick=()=>{swapId=id;closePop();renderCards();toast('TAP A DECK CARD TO SWAP')};
}

/* ---------- black market ---------- */
const DAY=864e5;
function dealsNow(){const day=Math.floor(Date.now()/DAY);if(!P.deals||P.deals.day!==day){const ids=shuffle(ownedIds()).slice(0,3),q=[6,4,2];
  P.deals={day,items:ids.map((id,i)=>({id,q:q[i],p:q[i]*(8+C[id].cost*4),sold:false})).concat([{caseK:3,p:60,sold:false}])};saveP()}return P.deals}
function renderShop(){
  const left=DAY-(Date.now()-P.spin);
  const box=$('deals');box.innerHTML='';
  dealsNow().items.forEach((it,i)=>{const el=document.createElement('div');el.className='deal'+(it.sold?' sold':'');
    if(it.caseK!=null)el.innerHTML=`<div class="cw"><div class="caseimg"><img src="assets/case${it.caseK}.png" alt=""></div></div><div class="price" style="background:linear-gradient(#9a6bd0,#6a3fa0)"><img src="assets/m_i_chips.png" alt="">${it.sold?'SOLD':it.p}</div>`;
    else el.innerHTML=`<div class="cw">${cardHTML(it.id,null,P.cards[it.id].l)}<span class="q">x${it.q}</span></div><div class="price"><img src="assets/u_coin.png" alt="">${it.sold?'SOLD':it.p}</div>`;
    el.onclick=()=>buy(i);box.appendChild(el)});
}
function buy(i){const it=P.deals.items[i];if(it.sold)return;
  if(it.caseK!=null){const e=P.cases.findIndex(c=>!c);if(e<0){toast('CASE SLOTS FULL');return}if(P.chips<it.p){toast('NOT ENOUGH CHIPS');return}P.chips-=it.p;P.cases[e]={k:it.caseK,at:null};it.sold=true;saveP();toast('GOLDEN SUITCASE ADDED');renderMenu();return}
  if(P.gold<it.p){toast('NOT ENOUGH GOLD');return}P.gold-=it.p;P.cards[it.id].n+=it.q;it.sold=true;saveP();toast(`+${it.q} ${C[it.id].n.toUpperCase()}`);renderMenu()}
/* ---------- roulette ---------- */
const RL=(()=>{
  const ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const REDS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const col=n=>n===0?'gr':REDS.has(n)?'rd':'bk';
  const HC={gr:'#26522a',rd:'#76201a',bk:'#141210'};
  const CHIPS=[{v:10,i:'chip_b'},{v:25,i:'chip_g'},{v:50,i:'chip_r'},{v:100,i:'chip_k'}];
  const chipImg=v=>v>=100?'chip_k':v>=50?'chip_r':v>=25?'chip_g':'chip_b';
  const FREE=25;
  let chip=25,bets={},spinning=false,last=null,hist=[];
  try{hist=JSON.parse(localStorage.getItem('dd-rh')||'[]')}catch(_){}
  const cv=$('rWheel'),g=cv.getContext('2d'),bc=$('rBall'),bg=bc.getContext('2d'),W=220,C=W/2,SEG=Math.PI*2/37;
  const HOLE=61,TRACK=75,POCK=52;
  const tur=new Image();tur.src='assets/r_tur.png';
  let rs=7;const rnd2=()=>{rs=(rs*16807)%2147483647;return rs/2147483647};
  const STAINS=Array.from({length:22},()=>({a:rnd2()*Math.PI*2,r:22+rnd2()*40,s:2+rnd2()*6,c:rnd2()<.5?'rgba(30,18,6,.55)':rnd2()<.5?'rgba(70,10,8,.5)':'rgba(120,110,60,.25)'}));
  const CHIPPED=new Set(Array.from({length:6},()=>Math.floor(rnd2()*37)));
  let wA=0,bA=-Math.PI/2,bR=TRACK,showBall=false,idleT=performance.now();
  const freeReady=()=>DAY-(Date.now()-P.spin)<=0;
  const total=()=>Object.values(bets).reduce((a,b)=>a+b,0);
  function drawWheel(){
    g.clearRect(0,0,W,W);
    g.fillStyle='#1a0f08';g.beginPath();g.arc(C,C,HOLE+2,0,7);g.fill();
    for(let i=0;i<37;i++){const n=ORDER[i],a0=wA+i*SEG-SEG/2-Math.PI/2;
      g.fillStyle=n===0?'#2b5a2c':REDS.has(n)?'#7a2219':'#161310';
      g.beginPath();g.moveTo(C,C);g.arc(C,C,HOLE,a0,a0+SEG);g.closePath();g.fill();
      if(CHIPPED.has(i)){g.fillStyle='rgba(200,180,140,.28)';g.beginPath();g.arc(C+Math.cos(a0+SEG*.6)*(HOLE-3),C+Math.sin(a0+SEG*.6)*(HOLE-3),2.2,0,7);g.fill()}
      g.strokeStyle='#7a5a22';g.lineWidth=1;g.beginPath();g.moveTo(C+Math.cos(a0)*36,C+Math.sin(a0)*36);g.lineTo(C+Math.cos(a0)*HOLE,C+Math.sin(a0)*HOLE);g.stroke();
      const am=a0+SEG/2;g.save();g.translate(C+Math.cos(am)*56,C+Math.sin(am)*56);g.rotate(am+Math.PI/2);
      g.fillStyle='#cdbb8e';g.font='bold 7px monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(n,0,0);g.restore();}
    g.fillStyle='rgba(20,12,6,.85)';g.beginPath();g.arc(C,C,48,0,7);g.fill();
    for(let i=0;i<37;i++){const a0=wA+i*SEG-SEG/2-Math.PI/2;g.strokeStyle='#5a4418';g.beginPath();g.moveTo(C+Math.cos(a0)*38,C+Math.sin(a0)*38);g.lineTo(C+Math.cos(a0)*48,C+Math.sin(a0)*48);g.stroke()}
    const gr=g.createRadialGradient(C-8,C-8,3,C,C,38);gr.addColorStop(0,'#6a4524');gr.addColorStop(1,'#25150a');
    g.fillStyle=gr;g.beginPath();g.arc(C,C,37,0,7);g.fill();
    for(const st of STAINS){const a=wA+st.a;g.fillStyle=st.c;g.beginPath();g.arc(C+Math.cos(a)*st.r,C+Math.sin(a)*st.r,st.s,0,7);g.fill()}
    if(tur.complete&&tur.naturalWidth){g.save();g.translate(C,C);g.rotate(wA);g.drawImage(tur,-38,-38,76,76);g.restore()}
  }
  function drawBall(){
    bg.clearRect(0,0,W,W);if(!showBall)return;
    const x=C+Math.cos(bA)*bR,y=C+Math.sin(bA)*bR;
    bg.fillStyle='rgba(0,0,0,.5)';bg.beginPath();bg.arc(x+1.5,y+2,4,0,7);bg.fill();
    bg.fillStyle='#d6cba6';bg.beginPath();bg.arc(x,y,3.8,0,7);bg.fill();
    bg.fillStyle='#8a7a4a';bg.fillRect(x,y+1,2,1.4);bg.fillStyle='#f3ecd2';bg.fillRect(x-2,y-2,1.6,1.6);
  }
  function draw(){drawWheel();drawBall()}
  function idle(t){if(!spinning){wA+=(t-idleT)*0.00016;draw()}idleT=t;requestAnimationFrame(idle)}
  function board(){
    const b=$('rBoard');b.innerHTML='';let k=0;
    const cell=(key,label,cls)=>{const e=document.createElement('button');e.type='button';e.className='rc '+cls;e.textContent=label;e.dataset.k=key;
      const sx=(k*37)%100,sy=(k*53)%100;k++;
      e.style.backgroundImage=`radial-gradient(circle at ${sx}% ${sy}%,rgba(20,10,4,.55) 0 14%,transparent 16%),radial-gradient(circle at ${(sx+48)%100}% ${(sy+31)%100}%,rgba(140,120,70,.18) 0 9%,transparent 11%),linear-gradient(170deg,rgba(255,255,255,.04),rgba(0,0,0,.25))`;
      if(bets[key])e.innerHTML+=`<i style="background-image:url(assets/${chipImg(bets[key])}.png)">${bets[key]}</i>`;
      if(last!=null&&(key==='n'+last||(key==='red'&&col(last)==='rd')||(key==='black'&&col(last)==='bk')))e.classList.add('hit');
      e.onclick=()=>place(key);b.appendChild(e)};
    cell('n0','0 · GREEN ×36','gr');
    for(let n=1;n<=36;n++)cell('n'+n,n,col(n));
    cell('red','RED ×2','rd wide');cell('black','BLACK ×2','bk wide');
  }
  function chips(){const c=$('rChips');c.innerHTML='';CHIPS.forEach(ch=>{const e=document.createElement('button');e.type='button';e.className='chp'+(ch.v===chip?' on':'');e.style.backgroundImage=`url(assets/${ch.i}.png)`;e.textContent=ch.v;e.setAttribute('aria-label',`Bet ${ch.v} gold`);e.onclick=()=>{chip=ch.v;chips()};c.appendChild(e)})}
  function info(){
    const t=total(),fr=freeReady(),cost=Math.max(0,t-(fr?FREE:0));
    $('rInfo').innerHTML=`${fr?`<span class="fr">FREE: ${FREE} ON THE HOUSE</span>`:`FREE SPIN IN ${fmt((DAY-(Date.now()-P.spin))/1000)}`}<br>BET <b>${t}</b>`;
    const sp=$('rSpin');sp.disabled=spinning||t===0||cost>P.gold;sp.textContent=spinning?'…':t===0?'BET FIRST':cost>P.gold?'NO GOLD':cost?`SPIN ${cost}`:'SPIN FREE';
    $('rClear').disabled=spinning||t===0;
    $('rHist').innerHTML=hist.map(n=>`<span style="background:${HC[col(n)]}">${n}</span>`).join('');
  }
  function refresh(){board();info()}
  function place(k){if(spinning)return;const t=total(),fr=freeReady();if(Math.max(0,t+chip-(fr?FREE:0))>P.gold){toast('NOT ENOUGH GOLD');return}
    if(last!=null){last=null;$('rRes').hidden=true}
    bets[k]=(bets[k]||0)+chip;refresh()}
  $('rClear').onclick=()=>{if(spinning)return;bets={};last=null;$('rRes').hidden=true;refresh()};
  /* croupier hand */
  const H=$('rHand'),pane=$('pEvents');let hp={x:0,y:0};
  const pr=el=>{const a=pane.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left-a.left,y:r.top-a.top,w:r.width,h:r.height}};
  async function hmove(x,y,d){const a=H.animate([{transform:`translate(${hp.x}px,${hp.y}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:d,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});hp={x,y};await a.finished.catch(()=>{})}
  const tip=(x,y)=>({x,y:y-H.offsetHeight*.85});
  async function handIn(x,y,d=420){const pw=pane.clientWidth,ph=pane.clientHeight;H.hidden=false;hp={x:pw*1.05,y:y-H.offsetHeight*.85};H.style.transform=`translate(${hp.x}px,${hp.y}px)`;const t=tip(x,y);await hmove(t.x,t.y,d)}
  async function handOut(d=380){const pw=pane.clientWidth;await hmove(pw*1.1,hp.y+20,d);H.hidden=true}
  /* cockroach */
  function roach(){const r=$('rRoach');if(spinning||tab!==4||!r.hidden||Math.random()<.4)return;
    const pw=pane.clientWidth,ph=pane.clientHeight,L=Math.random()<.5;
    const y0=ph*(.55+Math.random()*.25),y1=y0+(Math.random()-.5)*ph*.2,x0=L?-pw*.1:pw*1.05,x1=L?pw*1.05:-pw*.1;
    const ang=Math.atan2(y1-y0,x1-x0)*180/Math.PI+90;r.hidden=false;
    const mid=.35+Math.random()*.3;
    const a=r.animate([{transform:`translate(${x0}px,${y0}px) rotate(${ang}deg)`},{transform:`translate(${x0+(x1-x0)*mid}px,${y0+(y1-y0)*mid}px) rotate(${ang+8}deg)`,offset:.45},{transform:`translate(${x0+(x1-x0)*mid}px,${y0+(y1-y0)*mid}px) rotate(${ang-10}deg)`,offset:.6},{transform:`translate(${x1}px,${y1}px) rotate(${ang}deg)`}],{duration:5200,easing:'linear'});
    a.finished.then(()=>{r.hidden=true}).catch(()=>{r.hidden=true})}
  setInterval(roach,9000);
  const easeOut=t=>1-Math.pow(1-t,3);
  $('rSpin').onclick=async()=>{
    const t=total();if(spinning||!t)return;const fr=freeReady(),cost=Math.max(0,t-(fr?FREE:0));if(cost>P.gold)return;
    P.gold-=cost;if(fr)P.spin=Date.now();job('roul');saveP();renderTop();
    spinning=true;$('rRes').hidden=true;last=null;refresh();
    const res=Math.floor(Math.random()*37),idx=ORDER.indexOf(res);
    const D=5800,w0=wA,wSpin=Math.PI*2*(2.2+Math.random()*.6);
    const wEnd=w0+wSpin,bEnd=wEnd+idx*SEG-Math.PI/2,turns=5+Math.floor(Math.random()*2);
    const bStart=bEnd+Math.PI*2*turns+Math.PI*(-.25-((bEnd%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/(Math.PI*2)*0);
    // croupier drops the ball at the ball's start point
    const wr=pr($('rWheel')),sc=wr.w/W,sa=bStart;const bx=wr.x+(C+Math.cos(sa)*TRACK)*sc,by=wr.y+(C+Math.sin(sa)*TRACK)*sc;
    try{SND.duck(.35,.4)}catch(_){}
    await handIn(bx,by,450);bA=sa;bR=TRACK;showBall=true;draw();await sleepR(120);handOut(360);
    const t0=performance.now();
    function step(now){let u=Math.min(1,(now-t0)/D);const e=easeOut(u);
      wA=w0+wSpin*e;
      const free=bEnd+(bStart-bEnd)*(1-easeOut(Math.min(1,u/0.86)));
      const ride=wA+idx*SEG-Math.PI/2,s=u<.7?0:Math.min(1,(u-.7)/.2);
      bA=free*(1-s)+ride*s;
      bR=u<.55?TRACK:u<.8?TRACK-(TRACK-POCK)*((u-.55)/.25)+Math.abs(Math.sin(u*55))*5*(1-(u-.55)/.25):POCK;
      draw();
      if(u<1)requestAnimationFrame(step);else finish(res)}
    requestAnimationFrame(step);
  };
  const sleepR=ms=>new Promise(r=>setTimeout(r,ms));
  async function finish(res){
    last=res;hist=[res,...hist].slice(0,9);try{localStorage.setItem('dd-rh',JSON.stringify(hist))}catch(_){}
    let win=0;const lose=[];for(const k in bets){const v=bets[k];let w=0;if(k==='n'+res)w=v*36;else if(k==='red'&&col(res)==='rd')w=v*2;else if(k==='black'&&col(res)==='bk')w=v*2;win+=w;if(!w)lose.push(k)}
    const r=$('rRes');r.hidden=false;r.style.background=HC[col(res)];r.textContent=res;
    board();
    const nm=`${res} ${res===0?'GREEN':REDS.has(res)?'RED':'BLACK'}`;
    // hand sweeps the losing chips off the felt
    if(lose.length){await sleepR(500);const br=pr($('rBoard'));
      await handIn(br.x+br.w*.08,br.y+br.h*.55,480);
      const els=lose.map(k=>document.querySelector(`.rc[data-k="${k}"] i`)).filter(Boolean);
      els.forEach(e=>e.animate([{transform:'none',opacity:1},{transform:`translateX(${pane.clientWidth*.7}px) rotate(200deg)`,opacity:0}],{duration:520,easing:'cubic-bezier(.5,0,.8,.6)',fill:'forwards'}));
      await handOut(520)}
    P.gold+=win;addXP(win?8:3);saveP();renderTop();
    toast(win?`${nm} · YOU WIN ${win} GOLD!`:`${nm} · THE HOUSE WINS`);if(win)SND.sting('win',.7);
    try{SND.duck(.6,1)}catch(_){}
    spinning=false;bets={};refresh();
  }
  chips();refresh();draw();tur.onload=draw;requestAnimationFrame(t=>{idleT=t;idle(t)});
  return{refresh:info};
})();


/* ---------- popup ---------- */
function pop(html,noX){const p=$('pop');p.innerHTML=`<div class="box">${noX?'':'<button class="x" type="button" aria-label="Close" id="popX"><img src="assets/m_i_x.png" alt=""></button>'}${html}</div>`;p.hidden=false;const x=$('popX');if(x)x.onclick=closePop}
function closePop(){$('pop').hidden=true;$('pop').innerHTML=''}
$('pop').addEventListener('click',e=>{if(e.target.id==='pop'&&$('popX'))closePop()});
setInterval(()=>{if(!$('menu').hidden){renderCases();renderShop();renderTimers();if(tab===4)RL.refresh()}},1000);

/* ---------- arena ambience ---------- */
const AMB=(()=>{
  let cur=-1;const box=()=>$('amb');
  const live=()=>typeof inMatch==='function'&&inMatch()&&!PAUSED&&!document.hidden;
  const el=(cls,x,y,html)=>{const e=document.createElement('div');e.className=cls;e.style.left=x+'%';e.style.top=y+'%';if(html)e.innerHTML=html;box().appendChild(e);return e};
  const flies=(x,y,n,r,parent)=>{const o=document.createElement('div');o.className='orb';o.style.left=x+'%';o.style.top=y+'%';o.style.position='absolute';
    for(let i=0;i<n;i++){const f=document.createElement('i');f.style.setProperty('--d',(1.1+i*.37)+'s');f.style.setProperty('--r',(r+i*5)+'px');f.style.animationDelay=(-i*.4)+'s';o.appendChild(f)}(parent||box()).appendChild(o);return o};
  function drip(x,y0,y1,rip,cls){const d=el('dropw'+(cls?' '+cls:''),x,y0);d.animate([{top:y0+'%',opacity:.2},{top:y0+'%',opacity:1,offset:.25},{top:y1+'%',opacity:1}],{duration:900,easing:'cubic-bezier(.6,0,1,1)'}).finished.then(()=>{d.remove();if(rip)ripple(x,y1+.4)}).catch(()=>d.remove())}
  function ripple(x,y,big){const r=el('rip',x,y);if(big)r.style.width='9%';r.animate([{scale:'.15',opacity:1},{scale:'1',opacity:0}],{duration:1300,easing:'ease-out'}).finished.then(()=>r.remove()).catch(()=>r.remove())}
  function splash(x,y){const r=el('splash',x,y);r.animate([{scale:'.2',opacity:1},{scale:'1',opacity:0}],{duration:420,easing:'ease-out'}).finished.then(()=>r.remove()).catch(()=>r.remove())}

function newMatch(){

  S={arena:ar,round:1,hp:[START_HP,START_HP],coins:[0,0],bonus:[0,0],board:[[null,null,null],[null,null,null]],pile:[shuffle(deckNow()),shuffle(shuffle(ALL.filter(id=>C[id].u<=ar)).slice(0,6))],hand:[],sel:null,phase:'plan',ms:{by:{},kills:0,lost:0},spun:[false,false],mod:[{},{}],dbl:0,elvl:Math.max(1,Math.min(5,Math.round(deckNow().reduce((a,id)=>a+P.cards[id].l,0)/6)+(ar>=2?1:0)))};
  mood(0);S.phase='intro';S.busy=1;render();const m=S;
  (async()=>{await sleep(350);if(m!==S||S.dead)return;await intro();if(m!==S||S.dead)return;S.busy=0;S.phase='plan';say('start');startRound()})();
}
async function startRound(){
  S.phase='plan';S.sel=null;S.mod=[{},{}];S.dbl=0;
  for(const s of[0,1]){S.coins[s]=S.round+2+S.bonus[s];S.bonus[s]=0}
  S.hand=S.pile[0].splice(0,4).map(id=>({id,used:false}));
  if(S.round===ROUNDS)setTimeout(()=>say('last',.8),900);
  if(S.spun&&!S.spun[1]&&(S.round===ROUNDS||Math.random()<(S.hp[1]<S.hp[0]?.4:.25))){const m=S;render();await sleep(700);if(m!==S||S.dead)return;if(await doSpin(1))return}
  enemyPlan();
  log(`ROUND ${S.round}: PLACE CARDS`);
  setInfo('<strong>YOUR MOVE</strong>Tap a card in your hand, then tap one of your glowing slots.',true);$('info').style.opacity=0;
  dealIn();
}
function enemyPlan(){
  const hand=S.pile[1].splice(0,4+((S.mod&&S.mod[1].extra)||0));
  if(Math.random()<([.1,.25,.4,.5,.6,.7][S.arena]||.4)){smartPlan(hand);S.pile[1].push(...hand);return}
  for(const id of shuffle(hand)){
    const empty=[0,1,2].filter(i=>!S.board[1][i]);if(!empty.length)break;
    const d=C[id];if(d.cost>S.coins[1])continue;
    if(id==='blackhole'&&!S.board[0][1]&&Math.random()<.6)continue;
    if((id==='rabbit'||id==='coinflip')&&!S.board[1].some(Boolean)&&Math.random()<.7)continue;
    if(id==='eviction'){const t=[0,1,2].filter(i=>!S.board[1][i]&&S.board[0][i]);if(t.length){S.board[1][t[rnd(t.length)]]=mk(id,1);S.coins[1]-=d.cost;continue}else if(Math.random()<.7)continue}
    const facing=empty.filter(i=>S.board[0][i]);
    const lane=(facing.length&&Math.random()<.6)?facing[rnd(facing.length)]:empty[rnd(empty.length)];
    S.board[1][lane]=mk(id,1);S.coins[1]-=d.cost;
  }
  S.pile[1].push(...hand);
}

/* deeper dealers read the table: they hunt your survivors and keep cards alive */
function smartPlan(hand){const mine=S.board[0],pw=c=>c?c.atk+c.hp:0;
  for(const id of hand.slice().sort((a,b)=>C[b].cost-C[a].cost+Math.random()*.5)){
    const empty=[0,1,2].filter(i=>!S.board[1][i]);if(!empty.length)break;const d=C[id];if(d.cost>S.coins[1])continue;
    if(d.spell){const surv=mine.filter(Boolean);let lane=null;
      if(id==='eviction'){const t=empty.filter(i=>mine[i]).sort((a,b)=>pw(mine[b])-pw(mine[a]));if(t.length)lane=t[0]}
      else if(id==='blackhole'){if(mine[1]&&pw(mine[1])>=6&&empty.includes(1))lane=1}
      else if(id==='smell'||id==='lastcall'||id==='foodpois'){if(surv.length>=2)lane=empty[rnd(empty.length)]}
      else if(S.board[1].filter(x=>x&&!C[x.id].spell).length>=1)lane=empty[rnd(empty.length)];
      if(lane==null)continue;S.board[1][lane]=mk(id,1);S.coins[1]-=d.cost;continue}
    const me=mk(id,1);let best=empty[0],bs=-99;
    for(const i of empty){const f=mine[i];let sc=Math.random()*.6;
      if(f){sc+=(me.atk>=f.hp?4:0)+(f.atk<me.hp?2:-1)+me.atk*.3}else sc+=1+me.atk*.6;
      if(d.guard)sc+=[i-1,i+1].filter(j=>j>=0&&j<3&&S.board[1][j]).length*1.5;
      if(sc>bs){bs=sc;best=i}}
    S.board[1][best]=me;S.coins[1]-=d.cost}}

    if(d.bomb)bombs.push([1-s,i,d.bomb]);
    if(d.jar)jars.push([1-s,d.jar]);
    for(const q of[0,1])for(let j=0;j<3;j++){const x=S.board[q][j];if(!x||x===c||x.hp<=0)continue;if(C[x.id].hoard){x.hp+=1;float(slotEl(q,j),'+1 NAIL','#e6d6b0')}if(C[x.id].scav&&q!==s){x.atk+=1;float(slotEl(q,j),'+1 ATK','#f0c95c')}}
    if(d.payout){S.bonus[s]+=3;float(s?$('ehp'):$('php'),'+3 COINS','#f0c95c');SND.sfx('coin')}
    if(s===1)mood(3,800)}
  if(!any)return false;
  SND.sfx('die');saveP();
  await sleep(480);
  for(const s of[0,1])for(let i=0;i<3;i++){const c=S.board[s][i];if(c&&c.hp<=0)S.board[s][i]=null}
  render();
  if(jars.length){log('THE JAR BREAKS!');for(const[q,dm]of jars)for(let j=0;j<3;j++){const t=S.board[q][j];vfx(slotEl(q,j),'poison');if(t){t.hp-=dm;fx(cardOf(q,j),'hit');float(slotEl(q,j),'-'+dm,'#a6d257')}}render();await sleep(600);await cleanup()}
  if(bombs.length){log('BOOM! THE BELLHOP BLEW UP');for(const[s,i,dm]of bombs){vfx(slotEl(s,i),'boom');const t=S.board[s][i];if(t){t.hp-=dm;fx(cardOf(s,i),'hit');float(slotEl(s,i),'-'+dm,'#ff7a5c')}}
    render();await sleep(600);await cleanup()}
  for(const s of honk){const o=1-s;S.board[o]=shuffle(S.board[o]);log('HONK! CARDS SWAPPED');SND.sfx('honk')}
  render();
  if(honk.length){for(const s of honk){for(let j=0;j<3;j++){vfx(slotEl(1-s,j),'honk');if(S.board[1-s][j])fx(cardOf(1-s,j),'flip')}}await sleep(550)}
  return true;
}
function end(){
  S.phase='end';render();
  const[a,b]=S.hp.map(v=>Math.max(0,v)),win=a>b,draw=a===b;
  const sc=$('endScreen');sc.className='screen '+(win?'win':'lose');
  $('endT').textContent=draw?'DRAW':win?'YOU WIN':'BUSTED';
  $('endT').style.color=draw?'var(--paper)':win?'var(--bulb)':'var(--blood)';
  const tr=win?30:draw?0:-15,g=win?25+rnd(16):draw?10:5;P.trophies=Math.max(0,P.trophies+tr);P.gold+=g;
  const nb=arenaOf(P.trophies);let un='';if(nb>P.best){P.best=nb;P.sel=nb;P.newArena=nb;un=` NEW ARENA UNLOCKED: ${ARENAS[nb].n}! New cards are in your collection.`}
  let cm='';if(win){const e=P.cases.findIndex(c=>!c);if(e>=0){const r=Math.random(),k=r<.55?0:r<.85?1:r<.97?2:3;P.cases[e]={k,at:null};cm=` You won a ${CASES[k].n}!`}else cm=' Your case slots are full.'}
  const st=stOf(),today=Math.floor(Date.now()/DAY);st.g++;let ex='';
  if(win){st.w++;st.str++;st.best=Math.max(st.best,st.str);if(st.str>=2){const sb=Math.min(25,5*(st.str-1));P.gold+=sb;ex+=`<span>Win streak x${st.str}: +${sb} gold.</span>`}
    if(P.fw!==today){P.fw=today;P.gold+=50;ex+=`<span>First win of the day: +50 gold.</span>`}}else if(!draw){st.l++;st.str=0}else st.d++;
  st.top=Math.max(st.top,P.trophies);job('play');if(win)job('win');if(win&&a>=15)job('clean');P.tut=1;
  addXP(win?20:draw?10:5);saveP();
  $('endD').innerHTML=[`You ${a} HP · ${ARENAS[S.arena].who} ${b} HP. ${tr>0?'+':''}${tr} trophies, +${g} gold.`,cm.trim(),un.trim()].filter(Boolean).map(t=>`<span>${t}</span>`).join(' ')+ex+mvpHTML();
  mood(win?3:1);say(win?'lose':'win');SND.duck(win?.25:.18,1);const m=S;
  setTimeout(()=>{if(m!==S||S.dead)return;if(win){SND.duck(0,.4);SND.sting('win')}sc.hidden=false;sc.animate([{opacity:0},{opacity:1}],{duration:300})},1700);
}

function mvpHTML(){const m=S.ms;if(!m)return'';const top=Object.entries(m.by).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="mrep">${top?`<div class="mvp"><img src="assets/c_${top[0]}.png" alt=""><span>MVP: ${C[top[0]].f} · ${top[1]} damage</span></div>`:''}<span>Destroyed ${m.kills} · Lost ${m.lost}</span></div>`}
/* ---------- pause ---------- */
const inMatch=()=>S&&$('menu').hidden&&$('endScreen').hidden&&S.phase!=='end'&&S.phase!=='idle'&&!S.dead;
function pauseGame(){if(!inMatch()||PAUSED)return;PAUSED=true;document.getAnimations().forEach(a=>{try{a.pause()}catch(_){}});SND.duck(.15,.3);drawPause();$('pauseScr').hidden=false}
function resumeGame(){if(!PAUSED)return;$('pauseScr').hidden=true;PAUSED=false;document.getAnimations().forEach(a=>{try{if(a.playState==='paused')a.play()}catch(_){}});SND.duck(.6,.5)}
function drawPause(){
  $('pauseBox').innerHTML=`<h3>PAUSED</h3><p style="text-align:center">Round ${Math.min(S.round,ROUNDS)} of ${ROUNDS} · ${ARENAS[S.arena||0].who} is waiting.</p>
   <div class="pbtns"><button class="b y" id="pRes" type="button">RESUME</button><button class="b ${SND.isOn()?'g':'p'}" id="pSnd" type="button">SOUND: ${SND.isOn()?'ON':'OFF'}</button><button class="b r" id="pQuit" type="button">QUIT MATCH</button></div>`;
  $('pRes').onclick=resumeGame;
  $('pSnd').onclick=()=>{SND.toggle();if(SND.isOn())SND.duck(.15,.1);drawPause()};
  $('pQuit').onclick=()=>{$('pauseBox').innerHTML=`<h3>QUIT MATCH?</h3><p style="text-align:center">Walking away counts as a loss. You lose 15 trophies.</p>
     <div class="pbtns"><button class="b r" id="qY" type="button">QUIT</button><button class="b y" id="qN" type="button">KEEP PLAYING</button></div>`;
    $('qN').onclick=drawPause;$('qY').onclick=quitMatch};
}
function quitMatch(){
  S.dead=true;PAUSED=false;$('pauseScr').hidden=true;$('intro').hidden=true;$('say').classList.remove('on');$('tip').hidden=true;introTok++;
  document.getAnimations().forEach(a=>{try{a.cancel()}catch(_){}});
  document.querySelectorAll('.fly,.flt,.vfx,.dust').forEach(e=>e.remove());$('croupier').hidden=true;
  P.trophies=Math.max(0,P.trophies-15);addXP(2);saveP();
  S.phase='idle';openMenu(2);setTimeout(()=>toast('YOU WALKED AWAY · -15 TROPHIES'),200);
}
$('pauseB').onclick=e=>{e.stopPropagation();pauseGame()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.closest('#menu,#pop,#pauseScr,#endScreen'))SND.sfx('ui')},true);
setInterval(()=>{if(PAUSED||!S||!$('menu').hidden||!$('endScreen').hidden)return;const st=$('stage');if(st.classList.contains('low'))SND.sfx('heart');else if(S.arena===3&&S.phase!=='idle')SND.sfx('beep')},1600);
addEventListener('resize',()=>{if(S&&S.spun)tutor()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});

applyArena(P.sel);openMenu(2);
/* nightly cut: daily login reward, 7-night cycle, missing a night resets it */
const NIGHT=[['g',30],['g',40],['c',2],['g',60],['c',3],['g',80],['case',1]];
(function(){const today=Math.floor(Date.now()/DAY),L=P.login||{day:-9,n:0};if(L.day===today)return;
  const n=L.day===today-1?(L.n%7)+1:1;
  setTimeout(()=>{pop(`<h3>NIGHTLY CUT</h3><p style="text-align:center">Come back every night. Miss one and it starts over.</p><div class="nights">${NIGHT.map((r,i)=>`<div class="nt${i+1===n?' on':''}${i+1<n?' got':''}"><small>NIGHT ${i+1}</small><div class="ic">${RW(r)}</div></div>`).join('')}</div><div class="btns"><button class="b g" id="ntC" type="button">CLAIM</button></div>`,true);
    $('ntC').onclick=()=>{let r=NIGHT[n-1];if(r[0]==='case'&&!P.cases.some(c=>!c))r=['c',5];grant(r);P.login={day:today,n};saveP();closePop();renderMenu();toast('THE HOUSE PAYS ITS DEBTS')}},500)})();
S={arena:P.sel,round:1,hp:[START_HP,START_HP],coins:[3,3],bonus:[0,0],board:[[null,null,null],[null,null,null]],pile:[[],[]],hand:[],sel:null,phase:'idle'};
render();
</script>
